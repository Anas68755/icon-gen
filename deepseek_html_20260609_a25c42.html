<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>lunar•view icon generator pro</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #151b23;
      --card: #1c2330;
      --accent: #9aa5ff;
      --text: #e6edf3;
      --text-secondary: #a9b7cc;
      --border: #2a3342;
      --shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    body.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --card: #f0f0f5;
      --accent: #6c5ce7;
      --text: #1a1a2e;
      --text-secondary: #555;
      --border: #ddd;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 1rem;
      transition: background 0.3s, color 0.3s;
    }

    .app-header {
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .app-header h1 {
      font-weight: 500;
      font-size: clamp(1.5rem, 5vw, 2rem);
      color: var(--accent);
    }
    .app-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .theme-toggle-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 2rem;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 10;
    }
    .theme-toggle-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      position: sticky;
      top: 2rem;
    }

    .canvas-wrapper {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 0 1px var(--border);
      transition: transform 0.3s;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .canvas-wrapper:hover { transform: scale(1.02); }

    .size-tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--surface);
      padding: 0.4rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      justify-content: center;
    }
    .size-tab {
      padding: 0.5rem 1rem;
      border-radius: 1.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
      transition: 0.2s;
    }
    .size-tab.active {
      background: var(--accent);
      color: white;
    }

    .action-buttons {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .btn {
      padding: 0.6rem 1.4rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 20px rgba(154,165,255,0.4);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--card);
      border-color: var(--accent);
    }
    .btn-sm {
      padding: 0.25rem 0.7rem;
      font-size: 0.75rem;
      border-radius: 1rem;
      background: var(--border);
      border: none;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm.danger { background: rgba(255,123,139,0.2); color: #ff7b8b; }

    .filename-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 0.5rem 1rem;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 140px;
      text-align: center;
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .controls-panel::-webkit-scrollbar { width: 4px; }
    .controls-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
    }
    .section-header:hover { background: var(--card); }
    .section-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-header .arrow {
      transition: 0.3s;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .section.collapsed .arrow { transform: rotate(-90deg); }
    .section.collapsed .section-body { display: none; }
    .section-body {
      padding: 0 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .control-row { display: flex; flex-direction: column; gap: 0.3rem; }
    .control-row label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .control-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .control-row input[type="text"],
    .control-row input[type="number"],
    .control-row select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.4rem 0.6rem;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .color-picker-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .color-picker-row input[type="color"] {
      width: 32px; height: 32px;
      border: none; border-radius: 0.5rem;
      cursor: pointer; background: transparent; padding: 0;
    }
    .color-picker-row input[type="text"] {
      flex: 1; font-family: monospace; font-size: 0.8rem;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-switch {
      position: relative; width: 40px; height: 22px;
    }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top:0; left:0; right:0; bottom:0;
      background: var(--border); border-radius: 22px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .toggle-slider { background: var(--accent); }
    input:checked + .toggle-slider:before { transform: translateX(18px); }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
    }
    .emoji-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.3rem;
      cursor: pointer;
      font-size: 1.2rem;
      text-align: center;
      transition: 0.2s;
    }
    .emoji-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }

    .layer-item {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 0.8rem;
      padding: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .layer-item.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(154,165,255,0.3); }
    .layer-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .layer-emoji-input {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.2rem;
      color: var(--text);
      font-size: 1.2rem;
      width: 50px;
      text-align: center;
    }
    .layer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }
    .layer-controls label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-right: 0.2rem;
    }
    .layer-controls input[type="range"] {
      width: 50px;
      accent-color: var(--accent);
    }

    .reorder-btns {
      display: flex;
      gap: 0.3rem;
    }

    .stops-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .stop-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--card);
      padding: 0.3rem;
      border-radius: 0.5rem;
      flex-wrap: wrap;
    }
    .stop-item input[type="color"] { width: 28px; height: 28px; }
    .stop-item input[type="range"] { flex:1; min-width: 80px; }
    .stop-item button { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; }

    .undo-redo-group {
      display: flex;
      gap: 0.3rem;
      justify-content: center;
    }

    /* Mobile responsive */
    @media (max-width: 850px) {
      body {
        padding: 0.5rem;
      }
      .main-layout {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .preview-panel {
        position: static;
        top: auto;
      }
      .controls-panel {
        max-height: none;
        overflow-y: visible;
      }
      .theme-toggle-btn {
        position: static;
        margin: 0.5rem auto;
      }
      .size-tabs {
        gap: 0.3rem;
      }
      .size-tab {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
      }
      .btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }
      .filename-input {
        width: 100px;
      }
      .layer-controls {
        gap: 0.2rem;
      }
      .layer-controls input[type="range"] {
        width: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>🌙 lunar•view icon generator pro</h1>
    <p>multi‑emoji layers · advanced controls</p>
    <button class="theme-toggle-btn" id="themeToggle">🌓 theme</button>
    <div style="margin-top:0.5rem; display:flex; justify-content:center; gap:0.5rem;">
      <div class="undo-redo-group">
        <button class="btn btn-outline btn-sm" id="undoBtn" title="Undo (Ctrl+Z)">↩ undo</button>
        <button class="btn btn-outline btn-sm" id="redoBtn" title="Redo (Ctrl+Y)">↪ redo</button>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <!-- Preview -->
    <div class="preview-panel">
      <div class="canvas-wrapper">
        <canvas id="iconCanvas" width="512" height="512"></canvas>
      </div>
      <div class="size-tabs">
        <button class="size-tab" data-size="64">64</button>
        <button class="size-tab" data-size="128">128</button>
        <button class="size-tab" data-size="256">256</button>
        <button class="size-tab active" data-size="512">512</button>
        <button class="size-tab" data-size="1024">1024</button>
      </div>
      <div class="action-buttons">
        <input type="text" class="filename-input" id="exportFileName" value="icon" placeholder="filename">
        <button class="btn btn-primary" onclick="downloadPNG()">📥 PNG</button>
        <button class="btn btn-primary" onclick="downloadJPG()">📥 JPG</button>
        <button class="btn btn-outline" onclick="downloadSVG()">SVG</button>
        <button class="btn btn-outline btn-sm" onclick="downloadICO()">ICO</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <!-- Emoji Layers -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>🌟 layers</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div class="control-row"><label>quick emoji</label><div class="emoji-grid" id="emojiGrid"></div></div>
          <div id="layerList" style="display:flex; flex-direction:column; gap:0.6rem;"></div>
          <button class="btn btn-outline" onclick="addLayer()">➕ add layer</button>
        </div>
      </div>

      <!-- Background & Gradient -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>🎨 background & gradient</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div class="control-row"><label>gradient type</label><select id="gradientType"><option value="linear">linear</option><option value="radial">radial</option><option value="conic">conic</option><option value="solid">solid</option></select></div>
          <div class="control-row"><label>gradient angle</label><input type="range" id="gradientAngle" min="0" max="360" step="1" value="135"><span id="gradientAngleVal" style="font-size:0.7rem; text-align:right;">135°</span></div>
          <div><label style="font-size:0.7rem; text-transform:uppercase;">color stops</label></div>
          <div class="stops-list" id="stopsList"></div>
          <button class="btn btn-outline btn-sm" onclick="addStop()">+ add stop</button>
          <div class="control-row"><label>pattern</label><select id="patternType"><option value="none">none</option><option value="dots">dots</option><option value="grid">grid</option><option value="stripes">stripes</option><option value="noise">noise</option></select></div>
          <div class="control-row"><label>pattern opacity</label><input type="range" id="patternOpacity" min="0" max="1" step="0.01" value="0.1"><span id="patternOpacityVal" style="font-size:0.7rem;">10%</span></div>
        </div>
      </div>

      <!-- Shape & Border -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>🔷 shape & border</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div class="control-row"><label>shape</label><select id="shapeSelect"><option value="rounded">rounded square</option><option value="circle">circle</option><option value="square">square</option><option value="hexagon">hexagon</option><option value="diamond">diamond</option></select></div>
          <div class="control-row" id="roundnessRow"><label>corner radius</label><input type="range" id="roundness" min="0" max="0.5" step="0.01" value="0.22"><span id="roundnessVal" style="font-size:0.7rem;">22%</span></div>
          <div class="toggle-row"><label>border</label><label class="toggle-switch"><input type="checkbox" id="borderEnabled"><span class="toggle-slider"></span></label></div>
          <div id="borderColorRow" style="display:none;"><label>border color</label><div class="color-picker-row"><input type="color" id="borderColor" value="#9aa5ff"><input type="text" id="borderColorHex" value="#9aa5ff"></div></div>
          <div id="borderWidthRow" style="display:none;"><label>border width</label><input type="range" id="borderWidth" min="1" max="20" step="0.5" value="4"><span id="borderWidthVal" style="font-size:0.7rem;">4px</span></div>
        </div>
      </div>

      <!-- Glow -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>✨ glow</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div class="toggle-row"><label>inner glow</label><label class="toggle-switch"><input type="checkbox" id="innerGlowEnabled" checked><span class="toggle-slider"></span></label></div>
          <div class="control-row"><label>glow color</label><div class="color-picker-row"><input type="color" id="glowColor" value="#9aa5ff"><input type="text" id="glowColorHex" value="#9aa5ff"></div></div>
          <div><label>intensity</label><input type="range" id="glowIntensity" min="0" max="1" step="0.01" value="0.25"><span id="glowIntensityVal">25%</span></div>
          <div><label>spread</label><input type="range" id="glowSpread" min="0.2" max="0.9" step="0.01" value="0.5"><span id="glowSpreadVal">50%</span></div>
          <div class="toggle-row"><label>outer glow</label><label class="toggle-switch"><input type="checkbox" id="outerGlowEnabled"><span class="toggle-slider"></span></label></div>
          <div><label>outer size</label><input type="range" id="outerGlowSize" min="0" max="30" step="0.5" value="8"><span id="outerGlowSizeVal">8px</span></div>
        </div>
      </div>

      <!-- Text -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>📝 text</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div class="toggle-row"><label>show text</label><label class="toggle-switch"><input type="checkbox" id="textEnabled"><span class="toggle-slider"></span></label></div>
          <input type="text" id="overlayText" value="lunar•view" maxlength="30">
          <select id="fontFamily"><option value="'Segoe UI', sans-serif">Segoe UI</option><option value="'Arial Black', sans-serif">Arial Black</option><option value="'Courier New', monospace">Courier New</option><option value="'Georgia', serif">Georgia</option></select>
          <div><label>size</label><input type="range" id="fontSize" min="5" max="200" step="1" value="40"><span id="fontSizeVal">40px</span></div>
          <div><label>Y pos</label><input type="range" id="textPosY" min="0" max="100" step="1" value="75"><span id="textPosYVal">75%</span></div>
          <div class="color-picker-row"><input type="color" id="textColor" value="#ffffff"><input type="text" id="textColorHex" value="#ffffff"></div>
          <div class="toggle-row"><label>text shadow</label><label class="toggle-switch"><input type="checkbox" id="textShadowEnabled" checked><span class="toggle-slider"></span></label></div>
        </div>
      </div>

      <!-- Presets -->
      <div class="section">
        <div class="section-header" onclick="toggleSection(this)"><h3>💾 presets</h3><span class="arrow">▼</span></div>
        <div class="section-body">
          <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:0.5rem;">
            <button class="btn btn-outline btn-sm" onclick="loadPreset('cosmic')">🌙 cosmic</button>
            <button class="btn btn-outline btn-sm" onclick="loadPreset('sunset')">☀️ sunset</button>
            <button class="btn btn-outline btn-sm" onclick="loadPreset('ocean')">🌊 ocean</button>
            <button class="btn btn-outline btn-sm" onclick="loadPreset('forest')">🌲 forest</button>
            <button class="btn btn-outline btn-sm" onclick="loadPreset('neon')">⚡ neon</button>
            <button class="btn btn-outline btn-sm" onclick="loadPreset('minimal')">💎 minimal</button>
          </div>
          <button class="btn btn-outline btn-sm" onclick="resetAll()">🔄 reset</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('iconCanvas');
      const ctx = canvas.getContext('2d');
      let currentSize = 512;

      // State
      let layers = [
        { emoji: '🌙', size: 0.55, x: 0, y: 0, rotation: 0, opacity: 1, shadow: true }
      ];
      let selectedLayerIndex = 0;
      let stops = [
        { color: '#1a1f35', pos: 0 },
        { color: '#2d1f4e', pos: 50 },
        { color: '#151b2e', pos: 100 }
      ];

      // History
      const MAX_HISTORY = 50;
      let history = [];
      let historyIndex = -1;
      let ignoreStateChange = false;

      function getCurrentState() {
        return {
          layers: JSON.parse(JSON.stringify(layers)),
          selectedLayerIndex,
          stops: JSON.parse(JSON.stringify(stops)),
          gradientType: getVal('gradientType'),
          gradientAngle: getNum('gradientAngle'),
          patternType: getVal('patternType'),
          patternOpacity: getNum('patternOpacity'),
          shape: getVal('shapeSelect'),
          roundness: getNum('roundness'),
          borderEnabled: getChecked('borderEnabled'),
          borderColor: getVal('borderColor'),
          borderWidth: getNum('borderWidth'),
          innerGlowEnabled: getChecked('innerGlowEnabled'),
          glowColor: getVal('glowColor'),
          glowIntensity: getNum('glowIntensity'),
          glowSpread: getNum('glowSpread'),
          outerGlowEnabled: getChecked('outerGlowEnabled'),
          outerGlowSize: getNum('outerGlowSize'),
          textEnabled: getChecked('textEnabled'),
          overlayText: getVal('overlayText'),
          fontFamily: getVal('fontFamily'),
          fontSize: getNum('fontSize'),
          textPosY: getNum('textPosY'),
          textColor: getVal('textColor'),
          textShadowEnabled: getChecked('textShadowEnabled')
        };
      }

      function pushHistory() {
        if (ignoreStateChange) return;
        history = history.slice(0, historyIndex + 1);
        history.push(getCurrentState());
        if (history.length > MAX_HISTORY) {
          history.shift();
        } else {
          historyIndex++;
        }
      }

      function applyState(state) {
        ignoreStateChange = true;
        layers = JSON.parse(JSON.stringify(state.layers));
        selectedLayerIndex = state.selectedLayerIndex;
        stops = JSON.parse(JSON.stringify(state.stops));
        document.getElementById('gradientType').value = state.gradientType;
        document.getElementById('gradientAngle').value = state.gradientAngle;
        document.getElementById('gradientAngleVal').textContent = state.gradientAngle + '°';
        document.getElementById('patternType').value = state.patternType;
        document.getElementById('patternOpacity').value = state.patternOpacity;
        document.getElementById('patternOpacityVal').textContent = Math.round(state.patternOpacity*100)+'%';
        document.getElementById('shapeSelect').value = state.shape;
        document.getElementById('roundness').value = state.roundness;
        document.getElementById('roundnessVal').textContent = Math.round(state.roundness*100)+'%';
        document.getElementById('borderEnabled').checked = state.borderEnabled;
        document.getElementById('borderColor').value = state.borderColor;
        document.getElementById('borderColorHex').value = state.borderColor;
        document.getElementById('borderWidth').value = state.borderWidth;
        document.getElementById('borderWidthVal').textContent = state.borderWidth+'px';
        document.getElementById('innerGlowEnabled').checked = state.innerGlowEnabled;
        document.getElementById('glowColor').value = state.glowColor;
        document.getElementById('glowColorHex').value = state.glowColor;
        document.getElementById('glowIntensity').value = state.glowIntensity;

        document.getElementById('glowSpread').value = state.glowSpread;
        document.getElementById('glowSpreadVal').textContent = Math.round(state.glowSpread*100)+'%';
        document.getElementById('outerGlowEnabled').checked = state.outerGlowEnabled;
        document.getElementById('outerGlowSize').value = state.outerGlowSize;
        document.getElementById('outerGlowSizeVal').textContent = state.outerGlowSize+'px';
        document.getElementById('textEnabled').checked = state.textEnabled;
        document.getElementById('overlayText').value = state.overlayText;
        document.getElementById('fontFamily').value = state.fontFamily;
        document.getElementById('fontSize').value = state.fontSize;
        document.getElementById('fontSizeVal').textContent = state.fontSize+'px';
        document.getElementById('textPosY').value = state.textPosY;
        document.getElementById('textPosYVal').textContent = state.textPosY+'%';
        document.getElementById('textColor').value = state.textColor;
        document.getElementById('textColorHex').value = state.textColor;

        document.getElementById('borderWidthRow').style.display = state.borderEnabled ? 'flex' : 'none';
        document.getElementById('roundnessRow').style.display = state.shape === 'rounded' ? 'flex' : 'none';

        renderLayers();
        renderStops();
        drawIcon();
        ignoreStateChange = false;
      }

      function undoAction() {
        if (historyIndex > 0) {
          historyIndex--;
          applyState(history[historyIndex]);
        }
      }

      function redoAction() {
        if (historyIndex < history.length - 1) {
          historyIndex++;
          applyState(history[historyIndex]);
        }
      }

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
          e.preventDefault();
          undoAction();
        } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
          e.preventDefault();
          redoAction();
        }
      });

      const themeToggleBtn = document.getElementById('themeToggle');
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light');
      });

      function getVal(id) { return document.getElementById(id).value; }
      function getChecked(id) { return document.getElementById(id).checked; }
      function getNum(id) { return parseFloat(document.getElementById(id).value); }

      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1],16), g: parseInt(result[2],16), b: parseInt(result[3],16) } : { r:255,g:255,b:255 };
      }

      function addLayer() {
        layers.push({ emoji: '⭐', size: 0.3, x: 0, y: 0, rotation: 0, opacity: 1, shadow: true });
        selectedLayerIndex = layers.length - 1;
        renderLayers();
        drawIcon();
        pushHistory();
      }

      function duplicateLayer() {
        if (layers.length === 0) return;
        const copy = JSON.parse(JSON.stringify(layers[selectedLayerIndex]));
        layers.splice(selectedLayerIndex + 1, 0, copy);
        selectedLayerIndex = selectedLayerIndex + 1;
        renderLayers();
        drawIcon();
        pushHistory();
      }

      function removeLayer(index) {
        if (layers.length <= 1) return;
        layers.splice(index, 1);
        if (selectedLayerIndex >= layers.length) selectedLayerIndex = layers.length - 1;
        renderLayers();
        drawIcon();
        pushHistory();
      }

      function moveLayerUp(index) {
        if (index <= 0) return;
        [layers[index-1], layers[index]] = [layers[index], layers[index-1]];
        if (selectedLayerIndex === index) selectedLayerIndex = index - 1;
        else if (selectedLayerIndex === index - 1) selectedLayerIndex = index;
        renderLayers();
        drawIcon();
        pushHistory();
      }

      function moveLayerDown(index) {
        if (index >= layers.length - 1) return;
        [layers[index], layers[index+1]] = [layers[index+1], layers[index]];
        if (selectedLayerIndex === index) selectedLayerIndex = index + 1;
        else if (selectedLayerIndex === index + 1) selectedLayerIndex = index;
        renderLayers();
        drawIcon();
        pushHistory();
      }

      function renderLayers() {
        const container = document.getElementById('layerList');
        container.innerHTML = '';
        layers.forEach((layer, idx) => {
          const div = document.createElement('div');
          div.className = 'layer-item' + (idx === selectedLayerIndex ? ' active' : '');
          div.onclick = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.type === 'range') return;
            selectedLayerIndex = idx;
            renderLayers();
          };
          div.innerHTML = `
            <div class="layer-header">
              <span>layer ${idx+1}</span>
              <div style="display:flex; gap:0.2rem; flex-wrap:wrap;">
                <button class="btn-sm" onclick="event.stopPropagation(); moveLayerUp(${idx})" ${idx===0?'disabled':''}>▲</button>
                <button class="btn-sm" onclick="event.stopPropagation(); moveLayerDown(${idx})" ${idx===layers.length-1?'disabled':''}>▼</button>
                <button class="btn-sm" onclick="event.stopPropagation(); duplicateLayer()">⧉</button>
                <button class="btn-sm danger" onclick="event.stopPropagation(); removeLayer(${idx})" ${layers.length===1?'disabled':''}>🗑</button>
              </div>
            </div>
            <input class="layer-emoji-input" type="text" value="${escapeHtml(layer.emoji)}" onchange="updateLayer(${idx},'emoji',this.value)" onclick="event.stopPropagation();">
            <div class="layer-controls">
              <label>size</label><input type="range" min="0.1" max="0.9" step="0.01" value="${layer.size}" oninput="updateLayer(${idx},'size',parseFloat(this.value)); document.getElementById('lsize${idx}').textContent=Math.round(this.value*100)+'%'"><span id="lsize${idx}">${Math.round(layer.size*100)}%</span>
              <label>X</label><input type="range" min="-100" max="100" step="1" value="${layer.x}" oninput="updateLayer(${idx},'x',parseInt(this.value)); document.getElementById('lx${idx}').textContent=this.value"><span id="lx${idx}">${layer.x}</span>
              <label>Y</label><input type="range" min="-100" max="100" step="1" value="${layer.y}" oninput="updateLayer(${idx},'y',parseInt(this.value)); document.getElementById('ly${idx}').textContent=this.value"><span id="ly${idx}">${layer.y}</span>
              <label>rot</label><input type="range" min="0" max="360" step="1" value="${layer.rotation}" oninput="updateLayer(${idx},'rotation',parseInt(this.value)); document.getElementById('lrot${idx}').textContent=this.value+'°'"><span id="lrot${idx}">${layer.rotation}°</span>
              <label>opac</label><input type="range" min="0" max="1" step="0.05" value="${layer.opacity}" oninput="updateLayer(${idx},'opacity',parseFloat(this.value)); document.getElementById('lopac${idx}').textContent=Math.round(this.value*100)+'%'"><span id="lopac${idx}">${Math.round(layer.opacity*100)}%</span>
              <label>shadow</label><input type="checkbox" ${layer.shadow?'checked':''} onchange="updateLayer(${idx},'shadow',this.checked)">
            </div>
          `;
          container.appendChild(div);
        });
      }

      function updateLayer(index, prop, value) {
        layers[index][prop] = value;
        drawIcon();
        pushHistory();
      }

      function escapeHtml(text) {
        return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function addStop() {
        if (stops.length >= 8) return;
        const newPos = 50;
        stops.push({ color: '#ffffff', pos: newPos });
        stops.sort((a,b) => a.pos - b.pos);
        renderStops();
        drawIcon();
        pushHistory();
      }

      function removeStop(index) {
        if (stops.length <= 2) return;
        stops.splice(index, 1);
        renderStops();
        drawIcon();
        pushHistory();
      }

      function updateStop(index, prop, value) {
        stops[index][prop] = value;
        if (prop === 'pos') stops.sort((a,b) => a.pos - b.pos);
        renderStops();
        drawIcon();
        pushHistory();
      }

      function renderStops() {
        const container = document.getElementById('stopsList');
        container.innerHTML = '';
        stops.forEach((stop, idx) => {
          const div = document.createElement('div');
          div.className = 'stop-item';
          div.innerHTML = `
            <input type="color" value="${stop.color}" onchange="updateStop(${idx},'color',this.value)">
            <input type="range" min="0" max="100" value="${stop.pos}" oninput="updateStop(${idx},'pos',parseInt(this.value)); document.getElementById('stopPos${idx}').textContent=this.value+'%'">
            <span id="stopPos${idx}" style="font-size:0.7rem;">${stop.pos}%</span>
            <button onclick="removeStop(${idx})" ${stops.length<=2?'disabled':''}>✕</button>
          `;
          container.appendChild(div);
        });
      }

      function drawPattern(size, type, opacity) {
        if (type === 'none' || opacity <= 0) return;
        const patternCanvas = document.createElement('canvas');
        patternCanvas.width = size; patternCanvas.height = size;
        const pctx = patternCanvas.getContext('2d');
        pctx.globalAlpha = opacity;
        pctx.fillStyle = '#ffffff';
        const step = size / 20;
        if (type === 'dots') {
          for (let x = step; x < size; x += step * 2)
            for (let y = step; y < size; y += step * 2) {
              pctx.beginPath(); pctx.arc(x, y, step*0.15, 0, Math.PI*2); pctx.fill();
            }
        } else if (type === 'grid') {
          pctx.strokeStyle = '#ffffff'; pctx.lineWidth = 1;
          for (let i = step; i < size; i += step) {
            pctx.beginPath(); pctx.moveTo(i,0); pctx.lineTo(i,size); pctx.stroke();
            pctx.beginPath(); pctx.moveTo(0,i); pctx.lineTo(size,i); pctx.stroke();
          }
        } else if (type === 'stripes') {
          pctx.strokeStyle = '#ffffff'; pctx.lineWidth = size/40;
          for (let i = -size; i < size*2; i += step) {
            pctx.beginPath(); pctx.moveTo(i,0); pctx.lineTo(i+size,size); pctx.stroke();
          }
        } else if (type === 'noise') {
          const imageData = pctx.createImageData(size, size);
          for (let i=0; i<imageData.data.length; i+=4) {
            const val = Math.random()*255;
            imageData.data[i]=val; imageData.data[i+1]=val; imageData.data[i+2]=val; imageData.data[i+3]=255;
          }
          pctx.putImageData(imageData,0,0);
        }
        ctx.drawImage(patternCanvas,0,0);
      }

      function drawShape(size, shape, roundness) {
        ctx.beginPath();
        const r = size * roundness, cx = size/2, cy = size/2;
        switch (shape) {
          case 'circle': ctx.arc(cx, cy, size/2, 0, Math.PI*2); break;
          case 'square': ctx.rect(0,0,size,size); break;
          case 'hexagon':
            for (let i=0;i<6;i++) {
              const angle = (Math.PI/3)*i - Math.PI/6;
              const x = cx + (size/2)*Math.cos(angle), y = cy + (size/2)*Math.sin(angle);
              i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
            } break;
          case 'diamond': ctx.moveTo(cx,0); ctx.lineTo(size,cy); ctx.lineTo(cx,size); ctx.lineTo(0,cy); break;
          default: ctx.moveTo(r,0); ctx.lineTo(size-r,0); ctx.quadraticCurveTo(size,0,size,r); ctx.lineTo(size,size-r); ctx.quadraticCurveTo(size,size,size-r,size); ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r); ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
        }
        ctx.closePath();
      }

      function drawIcon() {
        const size = currentSize;
        canvas.width = size; canvas.height = size;
        const gradientType = getVal('gradientType');
        const gradientAngle = getNum('gradientAngle') * Math.PI/180;
        const shape = getVal('shapeSelect');
        const roundness = getNum('roundness');
        const innerGlow = getChecked('innerGlowEnabled');
        const glowRgb = hexToRgb(getVal('glowColor'));
        const glowIntensity = getNum('glowIntensity');
        const glowSpread = getNum('glowSpread');
        const outerGlow = getChecked('outerGlowEnabled');
        const outerGlowSize = getNum('outerGlowSize');
        const borderEnabled = getChecked('borderEnabled');
        const patternType = getVal('patternType');
        const patternOpacity = getNum('patternOpacity');
        const textEnabled = getChecked('textEnabled');

        ctx.clearRect(0,0,size,size);
        ctx.save();
        drawShape(size, shape, roundness);
        ctx.clip();

        if (gradientType === 'solid') {
          ctx.fillStyle = stops[0]?.color || '#000';
          ctx.fillRect(0,0,size,size);
        } else {
          let grad;
          if (gradientType === 'linear') {
            const x1 = size/2 - Math.cos(gradientAngle)*size/2;
            const y1 = size/2 - Math.sin(gradientAngle)*size/2;
            const x2 = size/2 + Math.cos(gradientAngle)*size/2;
            const y2 = size/2 + Math.sin(gradientAngle)*size/2;
            grad = ctx.createLinearGradient(x1, y1, x2, y2);
          } else if (gradientType === 'radial') {
            grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
          } else if (gradientType === 'conic') {
            grad = ctx.createConicGradient(gradientAngle, size/2, size/2);
          }
          stops.forEach(stop => {
            grad.addColorStop(stop.pos/100, stop.color);
          });
          ctx.fillStyle = grad;
          ctx.fillRect(0,0,size,size);
        }

        drawPattern(size, patternType, patternOpacity);

        if (innerGlow && glowIntensity > 0) {
          const haloRadius = size * glowSpread;
          const glowGrad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, haloRadius);
          glowGrad.addColorStop(0, 'rgba(0,0,0,0)');
          glowGrad.addColorStop(0.4, `rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowIntensity})`);
          glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glowGrad;
          ctx.fillRect(0,0,size,size);
        }

        layers.forEach(layer => {
          ctx.save();
          const offX = (layer.x/100)*(size/2);
          const offY = (layer.y/100)*(size/2);
          ctx.translate(size/2 + offX, size/2 + offY);
          if (layer.rotation) ctx.rotate(layer.rotation * Math.PI/180);
          ctx.globalAlpha = layer.opacity;
          const fontSize = size * layer.size;
          ctx.font = `${fontSize}px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (layer.shadow) {
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = fontSize * 0.1;
            ctx.shadowOffsetX = fontSize * 0.03;
            ctx.shadowOffsetY = fontSize * 0.03;
          }
          ctx.fillText(layer.emoji, 0, 0);
          ctx.restore();
        });

        if (textEnabled) {
          const text = getVal('overlayText');
          const textSize = getNum('fontSize');
          const textPosY = getNum('textPosY')/100 * size;
          ctx.save();
          ctx.font = `bold ${textSize}px ${getVal('fontFamily')}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (getChecked('textShadowEnabled')) {
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = textSize*0.3;
            ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
          }
          ctx.fillStyle = getVal('textColor');
          ctx.fillText(text, size/2, textPosY);
          ctx.restore();
        }

        ctx.restore();

        if (borderEnabled) {
          ctx.save();
          drawShape(size, shape, roundness);
          ctx.strokeStyle = getVal('borderColor');
          ctx.lineWidth = getNum('borderWidth');
          ctx.stroke();
          ctx.restore();
        }

        if (outerGlow && outerGlowSize > 0) {
          ctx.save();
          ctx.filter = `blur(${outerGlowSize}px)`;
          ctx.globalAlpha = glowIntensity;
          drawShape(size, shape, roundness);
          ctx.fillStyle = getVal('glowColor');
          ctx.fill();
          ctx.restore();
        }
      }

      function bindControls() {
        const sliders = [
          {id:'gradientAngle', valId:'gradientAngleVal', suffix:'°'},
          {id:'roundness', valId:'roundnessVal', suffix:'%', scale:100},
          {id:'glowIntensity', valId:'glowIntensityVal', suffix:'%', scale:100},
          {id:'glowSpread', valId:'glowSpreadVal', suffix:'%', scale:100},
          {id:'outerGlowSize', valId:'outerGlowSizeVal', suffix:'px'},
          {id:'borderWidth', valId:'borderWidthVal', suffix:'px'},
          {id:'fontSize', valId:'fontSizeVal', suffix:'px'},
          {id:'textPosY', valId:'textPosYVal', suffix:'%'},
          {id:'patternOpacity', valId:'patternOpacityVal', suffix:'%', scale:100}
        ];
        sliders.forEach(s => {
          const el = document.getElementById(s.id);
          if (!el) return;
          el.addEventListener('input', () => {
            const val = parseFloat(el.value);
            document.getElementById(s.valId).textContent = Math.round(val * (s.scale||1)) + s.suffix;
            drawIcon();
            pushHistory();
          });
        });

        document.getElementById('shapeSelect').addEventListener('change', () => {
          document.getElementById('roundnessRow').style.display = getVal('shapeSelect')==='rounded' ? 'flex' : 'none';
          drawIcon(); pushHistory();
        });

        document.getElementById('borderEnabled').addEventListener('change', () => {
          const en = getChecked('borderEnabled');
          document.getElementById('borderColorRow').style.display = en?'flex':'none';
          document.getElementById('borderWidthRow').style.display = en?'flex':'none';
          drawIcon(); pushHistory();
        });

        document.getElementById('textEnabled').addEventListener('change', () => { drawIcon(); pushHistory(); });
        ['innerGlowEnabled','outerGlowEnabled','textShadowEnabled'].forEach(id => document.getElementById(id).addEventListener('change', () => { drawIcon(); pushHistory(); }));
        ['gradientType','patternType','fontFamily'].forEach(id => document.getElementById(id).addEventListener('change', () => { drawIcon(); pushHistory(); }));
        document.getElementById('overlayText').addEventListener('input', () => { drawIcon(); pushHistory(); });
      }

      function loadPreset(name) {
        const presets = {
          cosmic: { layers:[{emoji:'🌙',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#1a1f35',pos:0},{color:'#2d1f4e',pos:50},{color:'#151b2e',pos:100}] },
          sunset: { layers:[{emoji:'☀️',size:0.6,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#ff6b35',pos:0},{color:'#f7c948',pos:50},{color:'#1a0a2e',pos:100}] },
          ocean: { layers:[{emoji:'🌊',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#0077b6',pos:0},{color:'#00b4d8',pos:50},{color:'#03045e',pos:100}] },
          forest: { layers:[{emoji:'🌲',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#2d6a4f',pos:0},{color:'#40916c',pos:50},{color:'#081c15',pos:100}] },
          neon: { layers:[{emoji:'⚡',size:0.6,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#0d0d0d',pos:0},{color:'#1a1a2e',pos:50},{color:'#0d0d0d',pos:100}] },
          minimal: { layers:[{emoji:'💎',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}], stops:[{color:'#ffffff',pos:0},{color:'#f0f0f0',pos:50},{color:'#e0e0e0',pos:100}] }
        };
        const p = presets[name];
        if (!p) return;
        layers = JSON.parse(JSON.stringify(p.layers));
        stops = JSON.parse(JSON.stringify(p.stops));
        selectedLayerIndex = 0;
        document.getElementById('gradientType').value = 'linear';
        document.getElementById('shapeSelect').value = 'rounded';
        document.getElementById('roundness').value = 0.22;
        document.getElementById('roundnessVal').textContent = '22%';
        document.getElementById('innerGlowEnabled').checked = true;
        document.getElementById('glowIntensity').value = 0.25; document.getElementById('glowIntensityVal').textContent = '25%';
        document.getElementById('glowSpread').value = 0.5; document.getElementById('glowSpreadVal').textContent = '50%';
        renderLayers();
        renderStops();
        drawIcon();
        pushHistory();
      }

      function resetAll() {
        loadPreset('cosmic');
        document.getElementById('borderEnabled').checked = false;
        document.getElementById('textEnabled').checked = false;
        document.getElementById('patternType').value = 'none';
        document.getElementById('patternOpacity').value = 0.1; document.getElementById('patternOpacityVal').textContent = '10%';

      }

      document.querySelectorAll('.size-tab').forEach(tab => {
        tab.addEventListener('click', () => {

      function getFileName() {
        return document.getElementById('exportFileName').value || 'icon';
      }

      function downloadPNG() {
        drawIcon();
        const a = document.createElement('a');
        a.download = `${getFileName()}_${currentSize}px.png`;
        a.href = canvas.toDataURL('image/png');

      }
      function downloadJPG() {
        drawIcon();
        const tmp = document.createElement('canvas');
        tmp.width = currentSize; tmp.height = currentSize;
        const tctx = tmp.getContext('2d');
        tctx.fillStyle = stops[0]?.color || '#fff';
        tctx.fillRect(0,0,currentSize,currentSize);
        tctx.drawImage(canvas,0,0);
        const a = document.createElement('a');
        a.download = `${getFileName()}_${currentSize}px.jpg`;

      function downloadSVG() {
        const svg = generateSVG();
        const blob = new Blob([svg],{type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = `${getFileName()}_${currentSize}px.svg`;
        a.href = url; a.click();
        URL.revokeObjectURL(url);
      }
      function downloadICO() {
        drawIcon();
        const a = document.createElement('a');
        a.download = `${getFileName()}_${currentSize}px.ico`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      }

      function generateSVG() {
        const size = currentSize;
        const shape = getVal('shapeSelect');
        const roundness = getNum('roundness');
        let shapeSvg = '';
        if (shape==='circle') shapeSvg = `<circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="url(#grad)"/>`;
        else if (shape==='square') shapeSvg = `<rect width="${size}" height="${size}" fill="url(#grad)"/>`;
        else shapeSvg = `<rect width="${size}" height="${size}" rx="${size*roundness}" fill="url(#grad)"/>`;
        const stopsSvg = stops.map(s => `<stop offset="${s.pos}%" stop-color="${s.color}"/>`).join('');
        let layersSvg = '';
        layers.forEach(layer => {
          const offX = (layer.x/100)*(size/2), offY = (layer.y/100)*(size/2);
          layersSvg += `<text x="${size/2+offX}" y="${size/2+offY}" text-anchor="middle" dominant-baseline="central" font-size="${size*layer.size}" transform="rotate(${layer.rotation} ${size/2+offX} ${size/2+offY})" opacity="${layer.opacity}">${layer.emoji}</text>`;
        });
        return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      ${stopsSvg}
    </linearGradient>
  </defs>
  ${shapeSvg}
  ${layersSvg}
</svg>`;
      }

      const emojiPresets = ['🌙','☀️','⭐','🪐','💎','🔮','🌌','🔥','⚡','👁️','🌈','🎮','🎯','🧿','💜','🖤','🤍','💚'];
      function initEmojiGrid() {
        const grid = document.getElementById('emojiGrid');
        emojiPresets.forEach(emoji => {
          const btn = document.createElement('button');
          btn.className = 'emoji-btn';
          btn.textContent = emoji;
          btn.onclick = () => {
            if (layers[selectedLayerIndex]) {
              layers[selectedLayerIndex].emoji = emoji;
              renderLayers();
              drawIcon();
              pushHistory();
            }
          };
          grid.appendChild(btn);
        });
      }

      function toggleSection(header) {
        header.parentElement.classList.toggle('collapsed');
      }

      document.getElementById('undoBtn').addEventListener('click', undoAction);
      document.getElementById('redoBtn').addEventListener('click', redoAction);

      window.addLayer = addLayer;
      window.duplicateLayer = duplicateLayer;
      window.removeLayer = removeLayer;
      window.moveLayerUp = moveLayerUp;
      window.moveLayerDown = moveLayerDown;
      window.updateLayer = updateLayer;
      window.addStop = addStop;
      window.removeStop = removeStop;
      window.updateStop = updateStop;
      window.loadPreset = loadPreset;
      window.resetAll = resetAll;
      window.toggleSection = toggleSection;
      window.downloadPNG = downloadPNG;
      window.downloadJPG = downloadJPG;
      window.downloadSVG = downloadSVG;
      window.downloadICO = downloadICO;

      initEmojiGrid();
      renderLayers();
      renderStops();
      bindControls();
      drawIcon();
      pushHistory();
    })();
  </script>
</body>
</html>
