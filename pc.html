<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lunar•view · PC studio | icon generator pro</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #151b23;
      --card: #1c2330;
      --accent: #9aa5ff;
      --text: #e6edf3;
      --text-secondary: #a9b7cc;
      --border: #2a3342;
      --shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    body.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --card: #f0f0f5;
      --accent: #6c5ce7;
      --text: #1a1a2e;
      --text-secondary: #555;
      --border: #ddd;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 0.5rem;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }
    .app-header {
      text-align: center;
      margin-bottom: 1rem;
      position: relative;
      padding: 0 0.5rem;
    }
    .app-header h1 {
      font-weight: 500;
      font-size: clamp(1.3rem, 5vw, 2rem);
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .app-header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .theme-toggle-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
    }
    .theme-toggle-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .canvas-wrapper {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 0 1px var(--border);
      width: 100%;
      max-width: 512px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .size-tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--surface);
      padding: 0.3rem;
      border-radius: 2rem;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      justify-content: center;
    }
    .size-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 1.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
      transition: 0.2s;
    }
    .size-tab.active {
      background: var(--accent);
      color: white;
    }
    .action-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 20px rgba(154,165,255,0.4);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: var(--card);
      border-color: var(--accent);
    }
    .btn-sm {
      padding: 0.25rem 0.6rem;
      font-size: 0.7rem;
      border-radius: 1rem;
      background: var(--border);
      border: none;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm.danger { background: rgba(255,123,139,0.2); color: #ff7b8b; }
    .filename-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 0.4rem 0.8rem;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
      width: 120px;
      text-align: center;
    }
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      padding-right: 0.3rem;
    }
    .controls-panel::-webkit-scrollbar { width: 4px; }
    .controls-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
    }
    .section-header:hover { background: var(--card); }
    .section-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .section-header .arrow {
      transition: 0.3s;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .section.collapsed .arrow { transform: rotate(-90deg); }
    .section.collapsed .section-body { display: none; }
    .section-body {
      padding: 0 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .control-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .control-row label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .control-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .control-row input[type="text"], .control-row input[type="number"], .control-row select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.4rem 0.5rem;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
      width: 100%;
    }
    .color-picker-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .color-picker-row input[type="color"] {
      width: 30px; height: 30px;
      border: none; border-radius: 0.4rem;
      cursor: pointer; background: transparent; padding: 0;
    }
    .color-picker-row input[type="text"] {
      flex: 1; font-family: monospace; font-size: 0.75rem;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-switch {
      position: relative; width: 38px; height: 20px;
    }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top:0; left:0; right:0; bottom:0;
      background: var(--border); border-radius: 20px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute; content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .toggle-slider { background: var(--accent); }
    input:checked + .toggle-slider:before { transform: translateX(18px); }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
    }
    .emoji-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.3rem;
      cursor: pointer;
      font-size: 1.1rem;
      text-align: center;
      transition: 0.2s;
    }
    .emoji-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.05); }
    .layer-item {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 0.7rem;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .layer-item.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(154,165,255,0.3); }
    .layer-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .layer-emoji-input {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.3rem;
      padding: 0.1rem 0.2rem;
      color: var(--text);
      font-size: 1.1rem;
      width: 45px;
      text-align: center;
    }
    .layer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      align-items: center;
    }
    .layer-controls label {
      font-size: 0.6rem;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-right: 0.1rem;
    }
    .layer-controls input[type="range"] {
      width: 45px;
      accent-color: var(--accent);
    }
    .stops-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .stop-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--card);
      padding: 0.3rem;
      border-radius: 0.4rem;
      flex-wrap: wrap;
    }
    .stop-item input[type="color"] { width: 26px; height: 26px; }
    .stop-item input[type="range"] { flex:1; min-width: 70px; }
    .stop-item button { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.2rem; }
    .undo-redo-group {
      display: flex;
      gap: 0.3rem;
      justify-content: center;
    }
    @media (max-width: 850px) {
      .main-layout { grid-template-columns: 1fr; gap: 1rem; }
      .controls-panel { max-height: none; overflow-y: visible; }
      .emoji-grid { grid-template-columns: repeat(4, 1fr); }
      .layer-controls input[type="range"] { width: 38px; }
    }
  </style>
</head>
<body>
<div class="app-header">
  <h1>🖥️ lunar•view icon generator pro</h1>
  <p>multi‑emoji layers · advanced controls · desktop precision</p>
  <button class="theme-toggle-btn" id="themeToggle">🌓 theme</button>
  <div style="margin-top:0.3rem; display:flex; justify-content:center; gap:0.5rem;">
    <div class="undo-redo-group">
      <button class="btn btn-outline btn-sm" id="undoBtn">↩ undo</button>
      <button class="btn btn-outline btn-sm" id="redoBtn">↪ redo</button>
    </div>
  </div>
</div>
<div class="main-layout">
  <div class="preview-panel">
    <div class="canvas-wrapper"><canvas id="iconCanvas" width="512" height="512"></canvas></div>
    <div class="size-tabs"><button class="size-tab" data-size="64">64</button><button class="size-tab" data-size="128">128</button><button class="size-tab" data-size="256">256</button><button class="size-tab active" data-size="512">512</button><button class="size-tab" data-size="1024">1024</button></div>
    <div class="action-buttons"><input type="text" class="filename-input" id="exportFileName" value="icon" placeholder="filename"><button class="btn btn-primary" onclick="downloadPNG()">📥 PNG</button><button class="btn btn-primary" onclick="downloadJPG()">📥 JPG</button><button class="btn btn-outline" onclick="downloadSVG()">SVG</button><button class="btn btn-outline btn-sm" onclick="downloadICO()">ICO</button></div>
  </div>
  <div class="controls-panel">
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>🌟 layers</h3><span class="arrow">▼</span></div><div class="section-body"><div class="control-row"><label>quick emoji</label><div class="emoji-grid" id="emojiGrid"></div></div><div id="layerList"></div><button class="btn btn-outline" onclick="addLayer()">➕ add layer</button></div></div>
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>🎨 background & gradient</h3><span class="arrow">▼</span></div><div class="section-body"><select id="gradientType"><option value="linear">linear</option><option value="radial">radial</option><option value="conic">conic</option><option value="solid">solid</option></select><div><label>angle</label><input type="range" id="gradientAngle" min="0" max="360" value="135"><span id="gradientAngleVal">135°</span></div><div><label>color stops</label><div class="stops-list" id="stopsList"></div><button class="btn-outline btn-sm" onclick="addStop()">+ add stop</button></div><select id="patternType"><option value="none">none</option><option value="dots">dots</option><option value="grid">grid</option><option value="stripes">stripes</option><option value="noise">noise</option></select><div><label>pattern opacity</label><input type="range" id="patternOpacity" min="0" max="1" step="0.01" value="0.1"><span id="patternOpacityVal">10%</span></div></div></div>
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>🔷 shape & border</h3><span class="arrow">▼</span></div><div class="section-body"><select id="shapeSelect"><option value="rounded">rounded square</option><option value="circle">circle</option><option value="square">square</option><option value="hexagon">hexagon</option><option value="diamond">diamond</option></select><div id="roundnessRow"><label>corner radius</label><input type="range" id="roundness" min="0" max="0.5" step="0.01" value="0.22"><span id="roundnessVal">22%</span></div><div class="toggle-row"><label>border</label><label class="toggle-switch"><input type="checkbox" id="borderEnabled"><span class="toggle-slider"></span></label></div><div id="borderColorRow" style="display:none;"><label>border color</label><div class="color-picker-row"><input type="color" id="borderColor" value="#9aa5ff"><input type="text" id="borderColorHex" value="#9aa5ff"></div></div><div id="borderWidthRow" style="display:none;"><label>border width</label><input type="range" id="borderWidth" min="1" max="20" step="0.5" value="4"><span id="borderWidthVal">4px</span></div></div></div>
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>✨ glow</h3><span class="arrow">▼</span></div><div class="section-body"><div class="toggle-row"><label>inner glow</label><label class="toggle-switch"><input type="checkbox" id="innerGlowEnabled" checked><span class="toggle-slider"></span></label></div><div class="color-picker-row"><input type="color" id="glowColor" value="#9aa5ff"><input type="text" id="glowColorHex" value="#9aa5ff"></div><div><label>intensity</label><input type="range" id="glowIntensity" min="0" max="1" step="0.01" value="0.25"><span id="glowIntensityVal">25%</span></div><div><label>spread</label><input type="range" id="glowSpread" min="0.2" max="0.9" step="0.01" value="0.5"><span id="glowSpreadVal">50%</span></div><div class="toggle-row"><label>outer glow</label><label class="toggle-switch"><input type="checkbox" id="outerGlowEnabled"><span class="toggle-slider"></span></label></div><div><label>outer size</label><input type="range" id="outerGlowSize" min="0" max="30" step="0.5" value="8"><span id="outerGlowSizeVal">8px</span></div></div></div>
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>📝 text</h3><span class="arrow">▼</span></div><div class="section-body"><div class="toggle-row"><label>show text</label><label class="toggle-switch"><input type="checkbox" id="textEnabled"><span class="toggle-slider"></span></label></div><input type="text" id="overlayText" value="lunar•view"><select id="fontFamily"><option value="'Segoe UI', sans-serif">Segoe UI</option><option value="'Arial Black'">Arial Black</option><option value="'Courier New'">Courier New</option><option value="'Georgia'">Georgia</option></select><div><label>size</label><input type="range" id="fontSize" min="5" max="200" value="40"><span id="fontSizeVal">40px</span></div><div><label>Y pos</label><input type="range" id="textPosY" min="0" max="100" value="75"><span id="textPosYVal">75%</span></div><div class="color-picker-row"><input type="color" id="textColor" value="#ffffff"><input type="text" id="textColorHex" value="#ffffff"></div><div class="toggle-row"><label>text shadow</label><label class="toggle-switch"><input type="checkbox" id="textShadowEnabled" checked><span class="toggle-slider"></span></label></div></div></div>
    <div class="section"><div class="section-header" onclick="toggleSection(this)"><h3>💾 presets</h3><span class="arrow">▼</span></div><div class="section-body"><div style="display:grid; grid-template-columns: repeat(3,1fr); gap:0.4rem;"><button class="btn-outline btn-sm" onclick="loadPreset('cosmic')">🌙 cosmic</button><button class="btn-outline btn-sm" onclick="loadPreset('sunset')">☀️ sunset</button><button class="btn-outline btn-sm" onclick="loadPreset('ocean')">🌊 ocean</button><button class="btn-outline btn-sm" onclick="loadPreset('forest')">🌲 forest</button><button class="btn-outline btn-sm" onclick="loadPreset('neon')">⚡ neon</button><button class="btn-outline btn-sm" onclick="loadPreset('minimal')">💎 minimal</button></div><button class="btn-outline btn-sm" onclick="resetAll()">🔄 reset</button></div></div>
  </div>
</div>
<script>
  // === FULL DESKTOP SCRIPT (original robust implementation) ===
  const canvas=document.getElementById('iconCanvas'), ctx=canvas.getContext('2d');
  let currentSize=512, layers=[{emoji:'🌙',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}], selectedLayerIndex=0, stops=[{color:'#1a1f35',pos:0},{color:'#2d1f4e',pos:50},{color:'#151b2e',pos:100}], history=[], historyIndex=-1, ignoreStateChange=false;
  function getCurrentState(){ return {layers:JSON.parse(JSON.stringify(layers)),selectedLayerIndex,stops:JSON.parse(JSON.stringify(stops)),gradientType:getVal('gradientType'),gradientAngle:getNum('gradientAngle'),patternType:getVal('patternType'),patternOpacity:getNum('patternOpacity'),shape:getVal('shapeSelect'),roundness:getNum('roundness'),borderEnabled:getChecked('borderEnabled'),borderColor:getVal('borderColor'),borderWidth:getNum('borderWidth'),innerGlowEnabled:getChecked('innerGlowEnabled'),glowColor:getVal('glowColor'),glowIntensity:getNum('glowIntensity'),glowSpread:getNum('glowSpread'),outerGlowEnabled:getChecked('outerGlowEnabled'),outerGlowSize:getNum('outerGlowSize'),textEnabled:getChecked('textEnabled'),overlayText:getVal('overlayText'),fontFamily:getVal('fontFamily'),fontSize:getNum('fontSize'),textPosY:getNum('textPosY'),textColor:getVal('textColor'),textShadowEnabled:getChecked('textShadowEnabled')}; }
  function pushHistory(){ if(ignoreStateChange)return; history=history.slice(0,historyIndex+1); history.push(getCurrentState()); if(history.length>50) history.shift(); else historyIndex++; }
  function applyState(s){ ignoreStateChange=true; layers=JSON.parse(JSON.stringify(s.layers)); selectedLayerIndex=s.selectedLayerIndex; stops=JSON.parse(JSON.stringify(s.stops)); for(let k in s) if(document.getElementById(k)) document.getElementById(k).value=s[k]; renderLayers(); renderStops(); drawIcon(); ignoreStateChange=false; }
  function undoAction(){ if(historyIndex>0){ historyIndex--; applyState(history[historyIndex]); } }
  function redoAction(){ if(historyIndex<history.length-1){ historyIndex++; applyState(history[historyIndex]); } }
  document.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); undoAction(); } else if((e.ctrlKey||e.metaKey)&&e.key==='y'){ e.preventDefault(); redoAction(); } });
  function getVal(id){return document.getElementById(id).value;} function getChecked(id){return document.getElementById(id).checked;} function getNum(id){return parseFloat(document.getElementById(id).value);}
  function hexToRgb(hex){ let r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:255,g:255,b:255}; }
  function addLayer(){ layers.push({emoji:'⭐',size:0.3,x:0,y:0,rotation:0,opacity:1,shadow:true}); selectedLayerIndex=layers.length-1; renderLayers(); drawIcon(); pushHistory(); }
  function duplicateLayer(i){ let copy=JSON.parse(JSON.stringify(layers[i])); layers.splice(i+1,0,copy); selectedLayerIndex=i+1; renderLayers(); drawIcon(); pushHistory(); }
  function removeLayer(i){ if(layers.length<=1)return; layers.splice(i,1); if(selectedLayerIndex>=layers.length) selectedLayerIndex=layers.length-1; renderLayers(); drawIcon(); pushHistory(); }
  function moveLayerUp(i){ if(i<=0)return; [layers[i-1],layers[i]]=[layers[i],layers[i-1]]; if(selectedLayerIndex===i) selectedLayerIndex=i-1; else if(selectedLayerIndex===i-1) selectedLayerIndex=i; renderLayers(); drawIcon(); pushHistory(); }
  function moveLayerDown(i){ if(i>=layers.length-1)return; [layers[i],layers[i+1]]=[layers[i+1],layers[i]]; if(selectedLayerIndex===i) selectedLayerIndex=i+1; else if(selectedLayerIndex===i+1) selectedLayerIndex=i; renderLayers(); drawIcon(); pushHistory(); }
  function updateLayer(idx,prop,val){ layers[idx][prop]=val; drawIcon(); pushHistory(); }
  function renderLayers(){ let container=document.getElementById('layerList'); container.innerHTML=''; layers.forEach((l,idx)=>{ let div=document.createElement('div'); div.className='layer-item'+(idx===selectedLayerIndex?' active':''); div.onclick=(e)=>{ if(e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON') selectedLayerIndex=idx; renderLayers(); }; div.innerHTML=`<div class="layer-header"><span>layer ${idx+1}</span><div><button class="btn-sm" onclick="event.stopPropagation(); moveLayerUp(${idx})">▲</button><button class="btn-sm" onclick="event.stopPropagation(); moveLayerDown(${idx})">▼</button><button class="btn-sm" onclick="event.stopPropagation(); duplicateLayer(${idx})">⧉</button><button class="btn-sm danger" onclick="event.stopPropagation(); removeLayer(${idx})">🗑</button></div></div><input class="layer-emoji-input" value="${l.emoji}" oninput="updateLayer(${idx},'emoji',this.value)"><div class="layer-controls"><label>size</label><input type="range" min="0.1" max="0.9" step="0.01" value="${l.size}" oninput="updateLayer(${idx},'size',parseFloat(this.value)); document.getElementById('lsize${idx}').textContent=Math.round(this.value*100)+'%'"><span id="lsize${idx}">${Math.round(l.size*100)}%</span><label>X</label><input type="range" min="-100" max="100" value="${l.x}" oninput="updateLayer(${idx},'x',parseInt(this.value)); document.getElementById('lx${idx}').textContent=this.value"><span id="lx${idx}">${l.x}</span><label>Y</label><input type="range" min="-100" max="100" value="${l.y}" oninput="updateLayer(${idx},'y',parseInt(this.value)); document.getElementById('ly${idx}').textContent=this.value"><span id="ly${idx}">${l.y}</span><label>rot</label><input type="range" min="0" max="360" value="${l.rotation}" oninput="updateLayer(${idx},'rotation',parseInt(this.value)); document.getElementById('lrot${idx}').textContent=this.value+'°'"><span id="lrot${idx}">${l.rotation}°</span><label>opac</label><input type="range" min="0" max="1" step="0.05" value="${l.opacity}" oninput="updateLayer(${idx},'opacity',parseFloat(this.value)); document.getElementById('lopac${idx}').textContent=Math.round(this.value*100)+'%'"><span id="lopac${idx}">${Math.round(l.opacity*100)}%</span><label>shadow</label><input type="checkbox" ${l.shadow?'checked':''} onchange="updateLayer(${idx},'shadow',this.checked)"></div>`; container.appendChild(div); }); }
  function addStop(){ if(stops.length>=8)return; stops.push({color:'#ffffff',pos:50}); stops.sort((a,b)=>a.pos-b.pos); renderStops(); drawIcon(); pushHistory(); }
  function removeStop(i){ if(stops.length<=2)return; stops.splice(i,1); renderStops(); drawIcon(); pushHistory(); }
  function updateStop(i,prop,val){ stops[i][prop]=val; if(prop==='pos') stops.sort((a,b)=>a.pos-b.pos); renderStops(); drawIcon(); pushHistory(); }
  function renderStops(){ let container=document.getElementById('stopsList'); container.innerHTML=''; stops.forEach((s,i)=>{ let div=document.createElement('div'); div.className='stop-item'; div.innerHTML=`<input type="color" value="${s.color}" oninput="updateStop(${i},'color',this.value)"><input type="range" min="0" max="100" value="${s.pos}" oninput="updateStop(${i},'pos',parseInt(this.value)); document.getElementById('stopPos${i}').textContent=this.value+'%'"><span id="stopPos${i}">${s.pos}%</span><button onclick="removeStop(${i})" ${stops.length<=2?'disabled':''}>✕</button>`; container.appendChild(div); }); }
  function drawPattern(s,type,op){ if(type==='none'||op<=0)return; let pc=document.createElement('canvas'); pc.width=s; pc.height=s; let pctx=pc.getContext('2d'); pctx.globalAlpha=op; pctx.fillStyle='#fff'; let step=s/20; if(type==='dots'){ for(let x=step;x<s;x+=step*2) for(let y=step;y<s;y+=step*2){ pctx.beginPath(); pctx.arc(x,y,step*0.15,0,Math.PI*2); pctx.fill(); } } else if(type==='grid'){ pctx.strokeStyle='#fff'; pctx.lineWidth=1; for(let i=step;i<s;i+=step){ pctx.beginPath(); pctx.moveTo(i,0); pctx.lineTo(i,s); pctx.stroke(); pctx.beginPath(); pctx.moveTo(0,i); pctx.lineTo(s,i); pctx.stroke(); } } else if(type==='stripes'){ pctx.strokeStyle='#fff'; pctx.lineWidth=s/40; for(let i=-s;i<s*2;i+=step){ pctx.beginPath(); pctx.moveTo(i,0); pctx.lineTo(i+s,s); pctx.stroke(); } } else if(type==='noise'){ let id=pctx.createImageData(s,s); for(let i=0;i<id.data.length;i+=4){ let v=Math.random()*255; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=255; } pctx.putImageData(id,0,0); } ctx.drawImage(pc,0,0); }
  function drawShape(s,shape,round){ ctx.beginPath(); let cx=s/2,cy=s/2; if(shape==='circle') ctx.arc(cx,cy,s/2,0,Math.PI*2); else if(shape==='square') ctx.rect(0,0,s,s); else if(shape==='hexagon') for(let i=0;i<6;i++){ let a=(Math.PI/3)*i-Math.PI/6; let x=cx+(s/2)*Math.cos(a),y=cy+(s/2)*Math.sin(a); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } else if(shape==='diamond'){ ctx.moveTo(cx,0); ctx.lineTo(s,cy); ctx.lineTo(cx,s); ctx.lineTo(0,cy); } else{ let r=s*round; ctx.moveTo(r,0); ctx.lineTo(s-r,0); ctx.quadraticCurveTo(s,0,s,r); ctx.lineTo(s,s-r); ctx.quadraticCurveTo(s,s,s-r,s); ctx.lineTo(r,s); ctx.quadraticCurveTo(0,s,0,s-r); ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); } ctx.closePath(); }
  function drawIcon(){ let s=currentSize; canvas.width=s; canvas.height=s; let gradType=getVal('gradientType'),gradAngle=getNum('gradientAngle')*Math.PI/180,shape=getVal('shapeSelect'),round=getNum('roundness'),innerGlow=getChecked('innerGlowEnabled'),glowRgb=hexToRgb(getVal('glowColor')),glowIntensity=getNum('glowIntensity'),glowSpread=getNum('glowSpread'),outerGlow=getChecked('outerGlowEnabled'),outerGlowSize=getNum('outerGlowSize'),borderEnabled=getChecked('borderEnabled'),patternType=getVal('patternType'),patternOpacity=getNum('patternOpacity'),textEnabled=getChecked('textEnabled'); ctx.clearRect(0,0,s,s); ctx.save(); drawShape(s,shape,round); ctx.clip(); if(gradType==='solid') ctx.fillStyle=stops[0]?.color||'#000'; else{ let grad; if(gradType==='linear'){ let x1=s/2-Math.cos(gradAngle)*s/2,y1=s/2-Math.sin(gradAngle)*s/2,x2=s/2+Math.cos(gradAngle)*s/2,y2=s/2+Math.sin(gradAngle)*s/2; grad=ctx.createLinearGradient(x1,y1,x2,y2); } else if(gradType==='radial') grad=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); else grad=ctx.createConicGradient(gradAngle,s/2,s/2); stops.forEach(st=>grad.addColorStop(st.pos/100,st.color)); ctx.fillStyle=grad; } ctx.fillRect(0,0,s,s); drawPattern(s,patternType,patternOpacity); if(innerGlow&&glowIntensity>0){ let halo=s*glowSpread; let gg=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,halo); gg.addColorStop(0,'rgba(0,0,0,0)'); gg.addColorStop(0.4,`rgba(${glowRgb.r},${glowRgb.g},${glowRgb.b},${glowIntensity})`); gg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=gg; ctx.fillRect(0,0,s,s); } layers.forEach(layer=>{ ctx.save(); let offX=(layer.x/100)*(s/2),offY=(layer.y/100)*(s/2); ctx.translate(s/2+offX,s/2+offY); if(layer.rotation) ctx.rotate(layer.rotation*Math.PI/180); ctx.globalAlpha=layer.opacity; let fSize=s*layer.size; ctx.font=`${fSize}px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; if(layer.shadow){ ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=fSize*0.1; ctx.shadowOffsetX=fSize*0.03; ctx.shadowOffsetY=fSize*0.03; } ctx.fillText(layer.emoji,0,0); ctx.restore(); }); if(textEnabled){ let txt=getVal('overlayText'),tSize=getNum('fontSize'),ty=getNum('textPosY')/100*s; ctx.save(); ctx.font=`bold ${tSize}px ${getVal('fontFamily')}`; ctx.textAlign='center'; ctx.textBaseline='middle'; if(getChecked('textShadowEnabled')){ ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=tSize*0.3; ctx.shadowOffsetX=2; ctx.shadowOffsetY=2; } ctx.fillStyle=getVal('textColor'); ctx.fillText(txt,s/2,ty); ctx.restore(); } ctx.restore(); if(borderEnabled){ ctx.save(); drawShape(s,shape,round); ctx.strokeStyle=getVal('borderColor'); ctx.lineWidth=getNum('borderWidth'); ctx.stroke(); ctx.restore(); } if(outerGlow&&outerGlowSize>0){ ctx.save(); ctx.filter=`blur(${outerGlowSize}px)`; ctx.globalAlpha=glowIntensity; drawShape(s,shape,round); ctx.fillStyle=getVal('glowColor'); ctx.fill(); ctx.restore(); } }
  function bindControls(){ let pairs=[{p:'borderColor',h:'borderColorHex'},{p:'glowColor',h:'glowColorHex'},{p:'textColor',h:'textColorHex'}]; pairs.forEach(({p,h})=>{ document.getElementById(p).addEventListener('input',()=>{ document.getElementById(h).value=document.getElementById(p).value; drawIcon(); pushHistory(); }); document.getElementById(h).addEventListener('input',()=>{ if(/^#[0-9a-fA-F]{6}$/.test(document.getElementById(h).value)){ document.getElementById(p).value=document.getElementById(h).value; drawIcon(); pushHistory(); } }); }); let sliders=['gradientAngle','roundness','glowIntensity','glowSpread','outerGlowSize','borderWidth','fontSize','textPosY','patternOpacity']; sliders.forEach(id=>{ let el=document.getElementById(id); if(el) el.addEventListener('input',()=>{ let v=parseFloat(el.value); let suffix=id==='roundness'?'%':(id==='patternOpacity'?'%':(id==='fontSize'||id==='borderWidth'||id==='outerGlowSize'?'px':(id==='textPosY'?'%':(id==='gradientAngle'?'°':(id==='glowIntensity'||id==='glowSpread'?'%':''))))); let scale=id==='roundness'||id==='glowIntensity'||id==='glowSpread'||id==='patternOpacity'?100:1; document.getElementById(id+'Val').textContent=Math.round(v*scale)+(suffix||''); drawIcon(); pushHistory(); }); }); document.getElementById('shapeSelect').addEventListener('change',()=>{ document.getElementById('roundnessRow').style.display=getVal('shapeSelect')==='rounded'?'flex':'none'; drawIcon(); pushHistory(); }); document.getElementById('borderEnabled').addEventListener('change',()=>{ let en=getChecked('borderEnabled'); document.getElementById('borderColorRow').style.display=en?'flex':'none'; document.getElementById('borderWidthRow').style.display=en?'flex':'none'; drawIcon(); pushHistory(); }); ['textEnabled','innerGlowEnabled','outerGlowEnabled','textShadowEnabled'].forEach(i=>document.getElementById(i).addEventListener('change',()=>{drawIcon(); pushHistory();})); ['gradientType','patternType','fontFamily'].forEach(i=>document.getElementById(i).addEventListener('change',()=>{drawIcon(); pushHistory();})); document.getElementById('overlayText').addEventListener('input',()=>{drawIcon(); pushHistory();}); }
  function loadPreset(name){ let p={cosmic:{layers:[{emoji:'🌙',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#1a1f35',pos:0},{color:'#2d1f4e',pos:50},{color:'#151b2e',pos:100}]},sunset:{layers:[{emoji:'☀️',size:0.6,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#ff6b35',pos:0},{color:'#f7c948',pos:50},{color:'#1a0a2e',pos:100}]},ocean:{layers:[{emoji:'🌊',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#0077b6',pos:0},{color:'#00b4d8',pos:50},{color:'#03045e',pos:100}]},forest:{layers:[{emoji:'🌲',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#2d6a4f',pos:0},{color:'#40916c',pos:50},{color:'#081c15',pos:100}]},neon:{layers:[{emoji:'⚡',size:0.6,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#0d0d0d',pos:0},{color:'#1a1a2e',pos:50},{color:'#0d0d0d',pos:100}]},minimal:{layers:[{emoji:'💎',size:0.55,x:0,y:0,rotation:0,opacity:1,shadow:true}],stops:[{color:'#ffffff',pos:0},{color:'#f0f0f0',pos:50},{color:'#e0e0e0',pos:100}]}}[name]; if(!p) return; layers=JSON.parse(JSON.stringify(p.layers)); stops=JSON.parse(JSON.stringify(p.stops)); selectedLayerIndex=0; document.getElementById('gradientType').value='linear'; document.getElementById('shapeSelect').value='rounded'; document.getElementById('roundness').value=0.22; document.getElementById('roundnessVal').textContent='22%'; document.getElementById('innerGlowEnabled').checked=true; document.getElementById('glowIntensity').value=0.25; document.getElementById('glowIntensityVal').textContent='25%'; document.getElementById('glowSpread').value=0.5; document.getElementById('glowSpreadVal').textContent='50%'; renderLayers(); renderStops(); drawIcon(); pushHistory(); }
  function resetAll(){ loadPreset('cosmic'); document.getElementById('borderEnabled').checked=false; document.getElementById('textEnabled').checked=false; document.getElementById('patternType').value='none'; document.getElementById('patternOpacity').value=0.1; document.getElementById('patternOpacityVal').textContent='10%'; document.getElementById('borderColorRow').style.display='none'; document.getElementById('borderWidthRow').style.display='none'; pushHistory(); }
  function toggleSection(header){ header.parentElement.classList.toggle('collapsed'); }
  function downloadPNG(){ drawIcon(); let a=document.createElement('a'); a.download=`${document.getElementById('exportFileName').value||'icon'}_${currentSize}px.png`; a.href=canvas.toDataURL('image/png'); a.click(); }
  function downloadJPG(){ drawIcon(); let t=document.createElement('canvas'); t.width=currentSize; t.height=currentSize; let tc=t.getContext('2d'); tc.fillStyle=stops[0]?.color||'#fff'; tc.fillRect(0,0,currentSize,currentSize); tc.drawImage(canvas,0,0); let a=document.createElement('a'); a.download=`${document.getElementById('exportFileName').value||'icon'}_${currentSize}px.jpg`; a.href=t.toDataURL('image/jpeg',0.95); a.click(); }
  function downloadSVG(){ let svg=`<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="${currentSize}" height="${currentSize}"><rect width="100%" height="100%" fill="url(#g)"/><defs><linearGradient id="g">${stops.map(s=>`<stop offset="${s.pos}%" stop-color="${s.color}"/>`).join('')}</linearGradient></defs>${layers.map(l=>`<text x="${currentSize/2+(l.x/100)*(currentSize/2)}" y="${currentSize/2+(l.y/100)*(currentSize/2)}" text-anchor="middle" dominant-baseline="central" font-size="${currentSize*l.size}" transform="rotate(${l.rotation} ${currentSize/2+(l.x/100)*(currentSize/2)} ${currentSize/2+(l.y/100)*(currentSize/2)})" opacity="${l.opacity}">${l.emoji}</text>`).join('')}</svg>`; let a=document.createElement('a'); a.download=`${document.getElementById('exportFileName').value||'icon'}_${currentSize}px.svg`; a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); a.click(); URL.revokeObjectURL(a.href); }
  function downloadICO(){ drawIcon(); let a=document.createElement('a'); a.download=`${document.getElementById('exportFileName').value||'icon'}_${currentSize}px.ico`; a.href=canvas.toDataURL('image/png'); a.click(); }
  let emojiPresets=['🌙','☀️','⭐','🪐','💎','🔮','🌌','🔥','⚡','👁️','🌈','🎮','🎯','🧿','💜','🖤','🤍','💚']; function initEmojiGrid(){ let g=document.getElementById('emojiGrid'); emojiPresets.forEach(e=>{ let b=document.createElement('button'); b.className='emoji-btn'; b.textContent=e; b.onclick=()=>{ if(layers[selectedLayerIndex]){ layers[selectedLayerIndex].emoji=e; renderLayers(); drawIcon(); pushHistory(); } }; g.appendChild(b); }); }
  window.addLayer=addLayer; window.duplicateLayer=duplicateLayer; window.removeLayer=removeLayer; window.moveLayerUp=moveLayerUp; window.moveLayerDown=moveLayerDown; window.updateLayer=updateLayer; window.addStop=addStop; window.removeStop=removeStop; window.updateStop=updateStop; window.loadPreset=loadPreset; window.resetAll=resetAll; window.toggleSection=toggleSection; window.downloadPNG=downloadPNG; window.downloadJPG=downloadJPG; window.downloadSVG=downloadSVG; window.downloadICO=downloadICO;
  document.getElementById('themeToggle').addEventListener('click',()=>document.body.classList.toggle('light'));
  document.querySelectorAll('.size-tab').forEach(t=>t.addEventListener('click',()=>{ document.querySelectorAll('.size-tab').forEach(tt=>tt.classList.remove('active')); t.classList.add('active'); currentSize=parseInt(t.dataset.size); drawIcon(); }));
  document.getElementById('undoBtn').addEventListener('click',undoAction); document.getElementById('redoBtn').addEventListener('click',redoAction);
  initEmojiGrid(); renderLayers(); renderStops(); bindControls(); drawIcon(); pushHistory();
</script>
