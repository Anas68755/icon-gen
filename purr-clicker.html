<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Purr Clicker · 20+ ترقيات · 10 مساعدين</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#1a0e07;--wood:#3d2010;--wood2:#4e2a14;--panel:#2a1508;
      --border:#6b3d1e;--caramel:#c4844a;--cream:#f0c987;
      --text:#fff3dc;--muted:#a0805a;--paw:#e8b87a;
      --pixel:'Press Start 2P',monospace;--body:'Nunito',sans-serif;
      --tab-h:64px;--hdr-h:52px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html{height:100%;overflow:hidden;}
    body{
      font-family:var(--body);background:var(--bg);color:var(--text);
      height:100dvh;display:flex;flex-direction:column;overflow:hidden;
      touch-action:manipulation;
    }
    body::before{
      content:'';position:fixed;inset:0;
      background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 18px,rgba(0,0,0,.06) 19px,rgba(0,0,0,0) 20px),
                 repeating-linear-gradient(0deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 28px,rgba(255,255,255,.015) 29px,rgba(255,255,255,0) 30px);
      pointer-events:none;z-index:0;
    }
    header{height:calc(var(--hdr-h) + env(safe-area-inset-top,0));background:var(--wood);border-bottom:3px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top,0);}
    header h1{font-family:var(--pixel);font-size:.6rem;color:var(--cream);text-shadow:2px 2px 0 #6b3000;}
    .hdr-cat{font-size:1.1rem;}.hdr-spacer{flex:1;}
    .hdr-stats{display:flex;gap:10px;}
    .hdr-stat{font-family:var(--pixel);font-size:.38rem;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;}
    .hdr-stat span{color:var(--cream);font-size:.48rem;}
    .btn-icon{background:var(--wood2);border:2px solid var(--border);border-radius:8px;color:var(--cream);width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .btn-icon:active{background:var(--border);}
    .tabs-content{flex:1;position:relative;overflow:hidden;}
    .tab-pane{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;padding:12px;gap:10px;}
    .tab-pane.active{display:flex;}
    #tab-cat{background:radial-gradient(ellipse at 50% 85%,rgba(61,32,16,.9) 0%,transparent 55%),var(--bg);align-items:center;justify-content:flex-start;}
    .counter-wrap{text-align:center;margin-bottom:10px;}
    .counter-main{font-family:var(--pixel);font-size:min(1.5rem,7vw);color:var(--cream);text-shadow:3px 3px 0 #6b3000;}
    .counter-label,.counter-cps,.evo-badge{font-family:var(--pixel);font-size:.42rem;color:var(--caramel);}
    .evo-badge{background:var(--wood2);border:2px solid var(--caramel);border-radius:4px;padding:5px 14px;margin-bottom:12px;}
    #catEmoji{cursor:pointer;font-size:min(240px,60vw);line-height:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.7));transition:transform .06s;user-select:none;display:inline-block;}
    #catEmoji:active{transform:scale(0.9);}
    .den-floor{width:min(260px,65vw);height:22px;background:repeating-linear-gradient(90deg,#3d2010 0,#3d2010 38px,#4e2a14 39px,#4e2a14 77px);border-top:3px solid #6b3d1e;margin-top:-4px;}
    .cat-name-tag{font-family:var(--pixel);font-size:.48rem;color:var(--paw);margin-top:8px;}
    .cat-trait{font-size:.75rem;color:var(--muted);font-style:italic;}
    .evo-progress-wrap{width:100%;max-width:300px;margin-top:12px;}
    .evo-progress-label{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:.32rem;color:var(--muted);margin-bottom:5px;}
    .evo-bar-track{height:10px;background:var(--panel);border:2px solid var(--border);}
    .evo-bar-fill{height:100%;background:linear-gradient(90deg,var(--caramel),var(--cream));transition:width .3s;}
    .panel-title{font-family:var(--pixel);font-size:.42rem;color:var(--caramel);background:var(--panel);border:2px solid var(--border);border-radius:4px;padding:7px;text-align:center;}
    .upg-btn,.once-btn{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;}
    .upg-btn:active:not(:disabled),.once-btn:active:not(:disabled){background:var(--wood2);transform:scale(.98);}
    .upg-btn.affordable,.once-btn.affordable{border-color:var(--caramel);box-shadow:0 0 10px rgba(196,132,74,.35);}
    .upg-icon,.once-icon{font-size:1.8rem;text-align:center;}
    .upg-name,.once-name{font-family:var(--pixel);font-size:.4rem;color:var(--cream);margin-bottom:4px;}
    .upg-desc,.once-desc{font-size:.7rem;color:var(--muted);}
    .upg-cost,.once-cost{font-family:var(--pixel);font-size:.4rem;color:var(--caramel);}
    .tab-bar{flex-shrink:0;background:var(--wood);border-top:3px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tab-h) + env(safe-area-inset-bottom,0));padding-bottom:env(safe-area-inset-bottom,0);}
    .tab-bar-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;font-family:var(--pixel);font-size:.3rem;color:var(--muted);position:relative;}
    .tab-bar-btn .tab-icon{font-size:1.4rem;}
    .tab-bar-btn.active{color:var(--caramel);}
    .tab-bar-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--caramel);border-radius:0 0 3px 3px;}
    .tab-badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--caramel);color:#1a0e07;font-family:var(--pixel);font-size:.26rem;padding:2px 4px;border-radius:3px;display:none;}
    .tab-badge.show{display:block;}
    .toast{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0) + 12px);left:50%;transform:translateX(-50%);background:var(--wood2);border:2px solid var(--caramel);border-radius:8px;padding:8px 12px;font-size:.75rem;opacity:0;transition:opacity .2s;z-index:10;}
    .toast.show{opacity:1;}
    .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.6),transparent);pointer-events:none;animation:rippleAnim .4s ease-out forwards;}
    @keyframes rippleAnim{0%{transform:scale(0);opacity:1;}100%{transform:scale(3);opacity:0;}}
    .small-stat{font-size:.7rem;color:var(--caramel);margin-top:6px;text-align:center;}
  </style>
</head>
<body>

<header>
  <span class="hdr-cat">🐱</span>
  <h1>Purr Clicker</h1>
  <div class="hdr-spacer"></div>
  <div class="hdr-stats">
    <div class="hdr-stat">ALL-TIME<span id="hdrTotal">0</span></div>
    <div class="hdr-stat">PER SEC<span id="hdrCps">0</span></div>
  </div>
  <button class="btn-icon" id="btnMusic">🎵</button>
  <button class="btn-icon" id="btnReset">🔄</button>
</header>

<div class="tabs-content">
  <div class="tab-pane active" id="tab-cat">
    <div class="counter-wrap"><div class="counter-main" id="counterMain">0</div><div class="counter-label">purrs collected</div><div class="counter-cps" id="counterCps">+0/s</div></div>
    <div class="evo-badge" id="evoBadge">Kitten</div>
    <div class="den-scene" style="text-align:center;"><div id="catEmoji">🐱</div><div class="den-floor"></div></div>
    <div class="cat-name-tag" id="catNameTag"></div><div class="cat-trait" id="catTrait"></div>
    <div class="evo-progress-wrap"><div class="evo-progress-label"><span id="evoCur">0</span><span id="evoStage"></span><span id="evoNext"></span></div><div class="evo-bar-track"><div class="evo-bar-fill" id="evoFill" style="width:0%"></div></div></div>
    <div class="small-stat" id="activeCompanionMsg"></div>
  </div>
  <div class="tab-pane" id="tab-upgrades"><div class="panel-title">✨ One-Time Upgrades (20+)</div><div id="onceList"></div><div class="section-div"></div><div class="panel-title">🎯 Milestones</div></div>
  <div class="tab-pane" id="tab-helpers"><div class="panel-title">🏠 Passive Helpers (10 total)</div><div id="buildingList"></div></div>
  <div class="tab-pane" id="tab-companions"><div class="panel-title">⭐ Companion Cats (5 unique)</div><div id="companionList"></div><div class="small-stat">✨ Companions boost production for 30 seconds!</div></div>
</div>

<nav class="tab-bar">
  <button class="tab-bar-btn active" data-tab="tab-cat"><span class="tab-icon">🐱</span>Cat</button>
  <button class="tab-bar-btn" data-tab="tab-upgrades"><span class="tab-icon">✨</span>Upgrades<span class="tab-badge" id="badge-upgrades"></span></button>
  <button class="tab-bar-btn" data-tab="tab-helpers"><span class="tab-icon">🏠</span>Helpers<span class="tab-badge" id="badge-helpers"></span></button>
  <button class="tab-bar-btn" data-tab="tab-companions"><span class="tab-icon">⭐</span>Companions<span class="tab-badge" id="badge-companions"></span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ---------- USER ID & RNG ----------
  let userId = localStorage.getItem('purrUserId');
  if(!userId){ userId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('purrUserId',userId); }
  function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
  function hashStr(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return h>>>0; }
  const rng = mulberry32(hashStr(userId));
  const FIRST=['Mochi','Biscuit','Walnut','Caramel','Toffee','Brownie','Hazel','Cocoa','Fudge','Truffle','Cinnamon','Maple','Mocha','Chestnut','Pecan'];
  const LAST=['Pawsworth','Barkley','Crumbleton','von Floof','McWhiskers','Tabbington','Nubbins','Clawsworth','Pouncington','Furball'];
  const TRAITS=['loves knocking things off shelves','judges you silently','always sits on the warmest spot','has a secret stash of bottle caps','zooms at 3am','plots world domination','knows you\'re faking sleep','steals food from the counter','climbs everything','scratches the furniture'];
  document.getElementById('catNameTag').textContent = FIRST[Math.floor(rng()*FIRST.length)]+' '+LAST[Math.floor(rng()*LAST.length)];
  document.getElementById('catTrait').textContent = '"'+TRAITS[Math.floor(rng()*TRAITS.length)]+'"';
  const personalMult = 1 + rng()*0.15;
  
  // ---------- EVOLUTIONS ----------
  const EVOLUTIONS = [
    {name:'Kitten',threshold:0},
    {name:'Junior',threshold:50},
    {name:'Lounger',threshold:250},
    {name:'Wanderer',threshold:1000},
    {name:'Hunter',threshold:5000},
    {name:'Midnight',threshold:20000},
    {name:'Ember',threshold:100000},
    {name:'Phantom',threshold:500000},
    {name:'Celestial',threshold:2000000},
    {name:'Ancient One',threshold:10000000},
  ];
  
  // ---------- HELPERS (10 total) ----------
  const BUILDINGS = [
    {id:'nap',name:'Napping Spot',icon:'😴',desc:'Sunny window ledge.',baseCost:15,baseCps:0.1},
    {id:'yarn',name:'Yarn Ball',icon:'🧶',desc:'Endless entertainment.',baseCost:100,baseCps:0.5},
    {id:'bowl',name:'Food Bowl',icon:'🍲',desc:'Keeps energy high.',baseCost:500,baseCps:2},
    {id:'tree',name:'Cat Tree',icon:'🌳',desc:'Prime surveillance.',baseCost:2000,baseCps:7},
    {id:'box',name:'Cardboard Box',icon:'📦',desc:'Best present ever.',baseCost:8000,baseCps:20},
    {id:'laser',name:'Laser Pointer',icon:'🔴',desc:'Infinite energy.',baseCost:30000,baseCps:60},
    {id:'fish',name:'Fish Pond',icon:'🐟',desc:'Personal seafood.',baseCost:100000,baseCps:200},
    {id:'catnip',name:'Catnip Garden',icon:'🌿',desc:'Legal substances.',baseCost:400000,baseCps:666},
    {id:'realm',name:'Parallel Realm',icon:'🌀',desc:'Cats know about this.',baseCost:2000000,baseCps:2000},
    {id:'coffee',name:'Cat Coffee',icon:'☕',desc:'Brews motivation.',baseCost:5000000,baseCps:5000},
  ];
  
  // ---------- ONE-TIME UPGRADES (20 total) ----------
  const ONCE_UPGRADES = [
    {id:'sharpclaws',name:'Sharp Claws',icon:'🗡️',desc:'+2× click power',cost:100,mult:2,type:'click'},
    {id:'fluffcoat',name:'Fluff Coat',icon:'🪮',desc:'+3× click power',cost:500,mult:3,type:'click'},
    {id:'catnap',name:'Power Nap',icon:'💤',desc:'+2× all production',cost:2000,mult:2,type:'cps'},
    {id:'fangs',name:'Fangs',icon:'🦷',desc:'+5× click power',cost:10000,mult:5,type:'click'},
    {id:'purrmotor',name:'Purr Motor',icon:'⚙️',desc:'+3× all production',cost:50000,mult:3,type:'cps'},
    {id:'midnight',name:'Night Vision',icon:'👁️',desc:'+10× click power',cost:200000,mult:10,type:'click'},
    {id:'starpaws',name:'Star Paws',icon:'⭐',desc:'+5× all production',cost:1000000,mult:5,type:'cps'},
    {id:'cosmicfur',name:'Cosmic Fur',icon:'🌌',desc:'+50× click power',cost:5000000,mult:50,type:'click'},
    {id:'lasereyes',name:'Laser Eyes',icon:'👁️‍🗨️',desc:'+2× click power',cost:8000,mult:2,type:'click'},
    {id:'ninja',name:'Ninja Reflexes',icon:'🥷',desc:'+3× click power',cost:25000,mult:3,type:'click'},
    {id:'lucky',name:'Lucky Charm',icon:'🍀',desc:'+2× all production',cost:40000,mult:2,type:'cps'},
    {id:'ancient',name:'Ancient Wisdom',icon:'📜',desc:'+4× all production',cost:150000,mult:4,type:'cps'},
    {id:'catnipOD',name:'Catnip Overdose',icon:'🌿💨',desc:'+8× click power',cost:300000,mult:8,type:'click'},
    {id:'quantum',name:'Quantum Pounce',icon:'⚛️',desc:'+15× click power',cost:1200000,mult:15,type:'click'},
    {id:'purrsonance',name:'Purr Resonance',icon:'🎵',desc:'+7× all production',cost:2500000,mult:7,type:'cps'},
    {id:'infinite',name:'Infinite Treats',icon:'🍬',desc:'+20× click power',cost:8000000,mult:20,type:'click'},
    {id:'multiverse',name:'Multiverse Collar',icon:'🌌',desc:'+12× all production',cost:20000000,mult:12,type:'cps'},
    {id:'godly',name:'Godly Whiskers',icon:'👼',desc:'+50× click power',cost:60000000,mult:50,type:'click'},
    {id:'cosmicpurr',name:'Cosmic Purr',icon:'🌠',desc:'+25× all production',cost:150000000,mult:25,type:'cps'},
    {id:'omnipotent',name:'Omnipotent Meow',icon:'🐱💫',desc:'+100× click power',cost:500000000,mult:100,type:'click'},
  ];
  
  // ---------- COMPANIONS (5) ----------
  const COMPANIONS = [
    {id:'tabby',name:'Tabby Tutor',icon:'🐈',desc:'+2× clicks & production',cost:250,clickMult:2,cpsMult:2,duration:30},
    {id:'siamese',name:'Siamese Sage',icon:'🐱',desc:'+4× clicks',cost:1200,clickMult:4,cpsMult:1,duration:30},
    {id:'maine',name:'Maine Coon',icon:'🦁',desc:'+5× production',cost:5000,clickMult:1,cpsMult:5,duration:30},
    {id:'void',name:'Void Cat',icon:'🐈‍⬛',desc:'+8× clicks & +2× prod',cost:25000,clickMult:8,cpsMult:2,duration:30},
    {id:'rainbow',name:'Rainbow Cat',icon:'🌈',desc:'+6× all + coin attraction',cost:100000,clickMult:6,cpsMult:6,duration:30},
  ];
  
  // ---------- RANDOM EVENTS ----------
  const EVENTS = [
    {msg:'🐟 A stray cat brings you a fish!',effect:()=>{ G.purrs += 500*G.cpsMult; updateUI(); },icon:'🐟'},
    {msg:'📦 Cardboard box appears! Bonus purrs!',effect:()=>{ G.purrs += Math.floor(1000*G.cpsMult); updateUI(); },icon:'📦'},
    {msg:'⚡ Meteor shower! 30 sec double production!',effect:()=>{ startTempBuff('cps',2,30); },icon:'⚡'},
    {msg:'💰 Treasure chest! +5000 purrs!',effect:()=>{ G.purrs += 5000; updateUI(); },icon:'💰'},
    {msg:'🐾 Lucky paw! Next clicks 3× for 20 sec!',effect:()=>{ startTempBuff('click',3,20); },icon:'🐾'},
  ];
  
  // ---------- GAME STATE ----------
  let G = {
    purrs:0, totalPurrs:0, clickPower:1, cps:0, buildings:{}, owned:{}, evoIndex:0, clickMult:1, cpsMult:1,
    activeCompanion: null, companionEndTime:0,
    tempClickBuff:1, tempCpsBuff:1, tempBuffEnd:0,
  };
  try{ const s = localStorage.getItem('purrSave'); if(s) Object.assign(G, JSON.parse(s)); }catch(e){}
  function save(){ localStorage.setItem('purrSave', JSON.stringify(G)); }
  
  // helpers
  function buildingCost(b){ return Math.floor(b.baseCost * Math.pow(1.15, G.buildings[b.id]||0)); }
  function buildingCps(b){ return (G.buildings[b.id]||0)*b.baseCps*G.cpsMult*personalMult; }
  function totalCps(){ return BUILDINGS.reduce((s,b)=>s+buildingCps(b),0); }
  function getClickPower(){ return Math.floor(G.clickMult * personalMult * G.tempClickBuff); }
  function getCpsMult(){ return G.cpsMult * G.tempCpsBuff; }
  function startTempBuff(type, mult, durationSec){
    if(type==='click'){ G.tempClickBuff = mult; G.tempBuffEnd = Date.now() + durationSec*1000; }
    else if(type==='cps'){ G.tempCpsBuff = mult; G.tempBuffEnd = Date.now() + durationSec*1000; }
    else if(type==='both'){ G.tempClickBuff = mult; G.tempCpsBuff = mult; G.tempBuffEnd = Date.now() + durationSec*1000; }
    setTimeout(()=>{ if(Date.now()>=G.tempBuffEnd){ G.tempClickBuff=1; G.tempCpsBuff=1; updateUI(); toast('✨ Buff expired!'); } }, durationSec*1000);
    updateUI();
  }
  function checkTempBuff(){ if(G.tempBuffEnd && Date.now()>G.tempBuffEnd){ G.tempClickBuff=1; G.tempCpsBuff=1; G.tempBuffEnd=0; updateUI(); } }
  
  // Companion activation
  function activateCompanion(c){
    if(G.activeCompanion && Date.now()<G.companionEndTime){ toast('Another companion is already active!'); return; }
    if(G.purrs < c.cost){ toast(`Need ${fmtNum(c.cost)} purrs!`); return; }
    G.purrs -= c.cost;
    G.activeCompanion = c.id;
    G.companionEndTime = Date.now() + c.duration*1000;
    G.clickMult *= c.clickMult;
    G.cpsMult *= c.cpsMult;
    updateUI();
    toast(`✨ ${c.name} appears! +${c.clickMult}x clicks, +${c.cpsMult}x production for ${c.duration}s`);
    playSfx();
    setTimeout(()=>{
      if(G.activeCompanion===c.id){
        G.clickMult /= c.clickMult;
        G.cpsMult /= c.cpsMult;
        G.activeCompanion = null;
        updateUI();
        toast(`😿 ${c.name} left... buffs are gone.`);
      }
    }, c.duration*1000);
    buildCompanionPanel();
  }
  
  // Random event loop
  let nextEventTime = Date.now() + 45000 + Math.random()*45000;
  setInterval(()=>{
    if(!document.hasFocus()) return;
    if(Date.now()>=nextEventTime){
      const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
      ev.effect();
      toast(ev.msg);
      playSfx();
      nextEventTime = Date.now() + 45000 + Math.random()*45000;
    }
  }, 5000);
  
  // ---------- SIMPLE EMOJI CAT ----------
  const catEmoji = document.getElementById('catEmoji');
  function updateCatEmoji(){
    catEmoji.textContent = '🐱';
  }
  
  // ---------- UI BUILDERS ----------
  function buildUpgradePanel(){
    const list=document.getElementById('onceList'); list.innerHTML='';
    ONCE_UPGRADES.forEach(u=>{
      const owned=G.owned[u.id];
      let btn=document.createElement('button');
      btn.className='once-btn'+(owned?'':(G.purrs>=u.cost?' affordable':''));
      btn.disabled=!!owned;
      btn.innerHTML=`<span class="once-icon">${u.icon}</span><div><div class="once-name">${u.name}</div><div class="once-desc">${u.desc}</div><div class="once-cost">${owned?'✓ owned':fmtNum(u.cost)+' purrs'}</div></div>`;
      if(!owned) btn.onclick=()=>buyOnce(u);
      list.appendChild(btn);
    });
  }
  function buildBuildingPanel(){
    const list=document.getElementById('buildingList'); list.innerHTML='';
    BUILDINGS.forEach(b=>{
      let cost=buildingCost(b), owned=G.buildings[b.id]||0, cps=buildingCps(b);
      let btn=document.createElement('button');
      btn.className='upg-btn'+(G.purrs>=cost?' affordable':'');
      btn.innerHTML=`<div class="upg-icon">${b.icon}</div><div><div class="upg-name">${b.name}</div><div class="upg-desc">${b.desc}</div><div class="upg-cost">${fmtNum(cost)} purrs</div><div style="font-size:.6rem;color:var(--paw);">Owned: ${owned} (+${fmtNum(cps,2)}/s)</div></div>`;
      btn.onclick=()=>buyBuilding(b);
      list.appendChild(btn);
    });
  }
  function buildCompanionPanel(){
    const list=document.getElementById('companionList'); list.innerHTML='';
    COMPANIONS.forEach(c=>{
      let btn=document.createElement('button');
      btn.className='once-btn'+(G.purrs>=c.cost?' affordable':'');
      btn.innerHTML=`<span class="once-icon">${c.icon}</span><div><div class="once-name">${c.name}</div><div class="once-desc">${c.desc}</div><div class="once-cost">${fmtNum(c.cost)} purrs</div></div>`;
      btn.onclick=()=>activateCompanion(c);
      list.appendChild(btn);
    });
  }
  function refreshPanels(){
    buildUpgradePanel(); buildBuildingPanel(); buildCompanionPanel();
    let canUpg = ONCE_UPGRADES.some(u=>!G.owned[u.id]&&G.purrs>=u.cost);
    let canHelp = BUILDINGS.some(b=>G.purrs>=buildingCost(b));
    let canComp = COMPANIONS.some(c=>G.purrs>=c.cost && (!G.activeCompanion || Date.now()>=G.companionEndTime));
    document.getElementById('badge-upgrades').classList.toggle('show',canUpg);
    document.getElementById('badge-helpers').classList.toggle('show',canHelp);
    document.getElementById('badge-companions').classList.toggle('show',canComp);
  }
  function buyBuilding(b){
    let cost = buildingCost(b);
    if(G.purrs<cost){ toast(`Need ${fmtNum(cost)} purrs!`); return; }
    G.purrs -= cost;
    G.buildings[b.id] = (G.buildings[b.id]||0)+1;
    buildBuildingPanel(); refreshPanels();
    toast(`${b.icon} ${b.name} added!`); playSfx();
  }
  function buyOnce(u){
    if(G.owned[u.id]) return;
    if(G.purrs<u.cost){ toast(`Need ${fmtNum(u.cost)} purrs!`); return; }
    G.purrs -= u.cost; G.owned[u.id]=true;
    if(u.type==='click') G.clickMult *= u.mult;
    else G.cpsMult *= u.mult;
    buildUpgradePanel(); refreshPanels();
    toast(`✨ ${u.name} unlocked!`); playSfx();
  }
  function updateUI(){
    checkTempBuff();
    document.getElementById('counterMain').textContent = fmtNum(Math.floor(G.purrs));
    document.getElementById('hdrTotal').textContent = fmtNum(Math.floor(G.totalPurrs));
    const cps = totalCps() * getCpsMult();
    document.getElementById('counterCps').textContent = `+${fmtNum(cps,1)}/s`;
    document.getElementById('hdrCps').textContent = fmtNum(cps,1);
    const evo = EVOLUTIONS[G.evoIndex];
    document.getElementById('evoBadge').textContent = evo.name;
    document.getElementById('evoStage').textContent = evo.name;
    const next = EVOLUTIONS[G.evoIndex+1];
    if(next){
      let pct = Math.min(100, ((G.totalPurrs-evo.threshold)/(next.threshold-evo.threshold))*100);
      document.getElementById('evoFill').style.width = pct+'%';
      document.getElementById('evoCur').textContent = fmtNum(G.totalPurrs-evo.threshold);
      document.getElementById('evoNext').textContent = fmtNum(next.threshold-evo.threshold);
    } else { document.getElementById('evoFill').style.width='100%'; document.getElementById('evoCur').textContent='MAX'; document.getElementById('evoNext').textContent=''; }
    if(G.activeCompanion && Date.now()<G.companionEndTime){
      let comp = COMPANIONS.find(c=>c.id===G.activeCompanion);
      if(comp) document.getElementById('activeCompanionMsg').innerHTML = `⭐ Active: ${comp.name} (${Math.ceil((G.companionEndTime-Date.now())/1000)}s left)`;
      else document.getElementById('activeCompanionMsg').innerHTML = '';
    } else document.getElementById('activeCompanionMsg').innerHTML = '';
    refreshPanels();
  }
  function checkEvolution(){
    let newIdx=0;
    for(let i=EVOLUTIONS.length-1;i>=0;i--) if(G.totalPurrs>=EVOLUTIONS[i].threshold){ newIdx=i; break; }
    if(newIdx!==G.evoIndex){ G.evoIndex=newIdx; updateCatEmoji(); toast(`🎉 Evolved to ${EVOLUTIONS[newIdx].name}!`); playSfx(); }
  }
  
  // Click handler
  catEmoji.addEventListener('pointerdown',e=>{
    e.preventDefault();
    let earn = Math.max(1, Math.floor(getClickPower()));
    G.purrs += earn; G.totalPurrs += earn;
    playSfx();
    catEmoji.style.transform = 'scale(0.9)';
    setTimeout(()=>{ catEmoji.style.transform = 'scale(1)'; }, 80);
    let rect=catEmoji.getBoundingClientRect();
    let x = (e.clientX||e.touches?.[0]?.clientX||rect.left+rect.width/2) - rect.left;
    let y = (e.clientY||e.touches?.[0]?.clientY||rect.top+rect.height/2) - rect.top;
    let ripple = document.createElement('div');
    ripple.className='ripple'; ripple.style.left=x+'px'; ripple.style.top=y+'px'; ripple.style.width='20px'; ripple.style.height='20px';
    catEmoji.parentElement.appendChild(ripple); setTimeout(()=>ripple.remove(),400);
    let particle=document.createElement('div'); particle.style.position='absolute'; particle.style.left=(rect.left+x-30)+'px'; particle.style.top=(rect.top+y-30)+'px'; particle.style.fontSize='1rem'; particle.textContent='+'+fmtNum(earn); particle.style.pointerEvents='none'; particle.style.fontWeight='bold'; particle.style.color='var(--cream)'; particle.style.textShadow='2px 2px 0 #6b3000'; particle.style.animation='float 1s ease-out forwards'; document.body.appendChild(particle); setTimeout(()=>particle.remove(),1000);
    checkEvolution(); updateUI();
  });
  
  // Audio (simplified from original)
  let audioCtx=null, musicOn=false, musicNodes=[], arpInt,bassInt,ambInt;
  const SCALES=[[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25],[293.66,329.63,369.99,392.00,440.00,493.88,554.37,587.33],[261.63,293.66,311.13,349.23,392.00,415.30,466.16,523.25],[220.00,246.94,261.63,293.66,329.63,349.23,392.00,440.00]];
  function getScale(){ let idx=Math.min(G.evoIndex,SCALES.length-1); return SCALES[idx]; }
  function note(freq,start,dur,vol,type='square'){ if(!audioCtx)return; let osc=audioCtx.createOscillator(), gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type=type; osc.frequency.value=freq; gain.gain.setValueAtTime(vol,start); gain.gain.exponentialRampToValueAtTime(0.01,start+dur); osc.start(start); osc.stop(start+dur); musicNodes.push({osc,gain}); }
  function arp(){ if(!audioCtx||!musicOn)return; let sc=getScale(); let now=audioCtx.currentTime; [0,2,4,7,4,2,0,4].forEach((si,i)=>note(sc[si%sc.length],now+i*0.13,0.18,0.045,'square')); }
  function bass(){ if(!audioCtx||!musicOn)return; let sc=getScale(); let now=audioCtx.currentTime; [0,0,4,3].forEach((i,idx)=>note(sc[i]*0.5,now+idx*0.42,0.38,0.05,'sawtooth')); }
  function amb(){ if(!audioCtx||!musicOn)return; let sc=getScale(); let now=audioCtx.currentTime; [0,2,4].forEach(si=>{ note(sc[si]*0.5,now,1.8,0.012,'sine'); }); }
  function startMusic(){ if(!audioCtx){ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==='suspended') audioCtx.resume(); musicOn=true; arpInt=setInterval(arp,1040); bassInt=setInterval(bass,1680); ambInt=setInterval(amb,3360); }
  function stopMusic(){ musicOn=false; clearInterval(arpInt);clearInterval(bassInt);clearInterval(ambInt); musicNodes.forEach(n=>{ try{ n.osc.stop(); n.osc.disconnect(); n.gain.disconnect(); }catch(e){} }); musicNodes=[]; }
  function playSfx(){ if(audioCtx && musicOn) note(880, audioCtx.currentTime, 0.1, 0.08, 'square'); }
  document.getElementById('btnMusic').onclick=()=>musicOn?stopMusic():startMusic();
  document.getElementById('btnReset').onclick=()=>{ if(confirm('Reset game? All progress lost!')){ localStorage.removeItem('purrSave'); location.reload(); } };
  
  // tick
  let lastTick=Date.now();
  setInterval(()=>{ let now=Date.now(), dt=(now-lastTick)/1000; lastTick=now; let earn = totalCps() * getCpsMult() * dt; if(earn>0){ G.purrs+=earn; G.totalPurrs+=earn; checkEvolution(); updateUI(); } save(); }, 100);
  function toast(msg){ let el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
  function fmtNum(n,dec=0){ if(n>=1e12) return (n/1e12).toFixed(1)+'T'; if(n>=1e9) return (n/1e9).toFixed(1)+'B'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return Math.floor(n*Math.pow(10,dec))/Math.pow(10,dec); }
  
  // Tab switching
  document.querySelectorAll('.tab-bar-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const target=btn.dataset.tab;
      document.querySelectorAll('.tab-bar-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(target).classList.add('active');
      if(target==='tab-upgrades') document.getElementById('badge-upgrades').classList.remove('show');
      if(target==='tab-helpers') document.getElementById('badge-helpers').classList.remove('show');
      if(target==='tab-companions') document.getElementById('badge-companions').classList.remove('show');
    });
  });
  
  // float animation
  const style = document.createElement('style');
  style.textContent = '@keyframes float { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }';
  document.head.appendChild(style);
  
  // init
  function init(){
    buildUpgradePanel(); buildBuildingPanel(); buildCompanionPanel();
    updateCatEmoji();
    updateUI();
    refreshPanels();
    if(!musicOn && localStorage.getItem('purrMusicPref')!=='off') startMusic();
  }
  init();
})();
</script>
</body>
</html>
