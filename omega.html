<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>أوميغا نيون أو إس • محطة عمل شاملة</title>
  <style>
    :root {
      --bg: #050816;
      --panel: #0f172a;
      --card: #111827;
      --text: #dbeafe;
      --cyan: #00f5ff;
      --pink: #ff00e5;
      --green: #39ff14;
      --purple: #8b5cf6;
      --radius: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #111936, #050816 45%),
                  radial-gradient(circle at 80% 80%, #170c2b, #050816 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0.8rem 1rem;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: rgba(5, 8, 22, 0.8);
      border-bottom: 1px solid rgba(0, 245, 255, 0.35);
      padding: 0.8rem 1.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
      border-radius: 0 0 30px 30px;
      margin-bottom: 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    h1 {
      margin-right: auto;
      color: var(--cyan);
      text-shadow: 0 0 18px var(--cyan), 0 0 40px var(--cyan);
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 1.9rem;
    }
    input, button, textarea, select {
      border: none;
      outline: none;
      border-radius: 18px;
      padding: 0.65rem 1rem;
      background: #0b1225;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      border: 1px solid rgba(0, 245, 255, 0.25);
      transition: all 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 245, 255, 0.6);
    }
    button {
      background: rgba(15, 23, 42, 0.9);
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      backdrop-filter: blur(8px);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.25);
    }
    button:hover {
      transform: translateY(-2px);
      background: #1e2848;
      box-shadow: 0 0 24px var(--cyan), 0 5px 18px rgba(255,0,229,0.3);
      border-color: var(--pink);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      padding: 0.5rem 0 1.8rem;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 245, 255, 0.25);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--cyan);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.6), 0 0 40px rgba(255,0,229,0.3);
      background: rgba(20, 30, 55, 0.9);
    }
    .card h3 { margin:0; font-size:1.2rem; display:flex; align-items:center; gap:0.3rem; color:#fff; }
    .small { opacity:0.7; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--cyan); }
    .modal {
      position: fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
      display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem;
    }
    .hidden { display:none; }
    .modal-box {
      width:95%; max-width:850px; max-height:90vh; overflow-y:auto;
      background:#0b1120; border-radius:30px; padding:1.8rem;
      border:1px solid var(--cyan); box-shadow:0 0 45px rgba(0,245,255,0.5), 0 0 70px rgba(255,0,229,0.3);
    }
    .row { display:flex; gap:0.8rem; flex-wrap:wrap; margin:0.9rem 0; align-items:center; }
    .big { font-size:3rem; font-weight:700; color:var(--cyan); text-shadow:0 0 18px var(--cyan); text-align:center; }
    pre { white-space:pre-wrap; background:#050a18; padding:1rem; border-radius:16px; overflow-x:auto; color:#cbd5e1; border:1px solid #2d3a5e; margin:0.5rem 0; }
    textarea { width:100%; background:#020617; border-radius:16px; color:#e2e8f0; resize:vertical; }
    canvas { border-radius:16px; background:#000; }
    footer { margin-top:auto; text-align:center; padding:1.5rem; opacity:0.7; color:var(--cyan); }
  </style>
</head>

      // ----- state & language -----
      const defaultState = {
        notes: '', tasks: [], habits: [], water: 0,
        pomodoroWork: 25, pomodoroBreak: 5,
        lang: 'ar'
      };
      let state = JSON.parse(localStorage.getItem('omega_state')) || {};
      state = Object.assign({}, defaultState, state);
      function saveState() { localStorage.setItem('omega_state', JSON.stringify(state)); }

      let currentLang = state.lang || 'ar';
      function t(key) {
        return translations[currentLang]?.[key] || translations['en'][key] || key;
      }

      function setLanguage(lang) {
        currentLang = lang;
        state.lang = lang;
        saveState();
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        // update UI static elements
        document.querySelector('h1').innerText = lang==='ar' ? '⚡ أوميغا نيون أو إس' : '⚡ OMEGA NEON OS';
        document.getElementById('search').placeholder = t('searchPlaceholder');
        document.getElementById('command').placeholder = t('commandPlaceholder');
        document.getElementById('exportBtn').innerHTML = t('exportBtn');
        document.getElementById('importBtn').innerHTML = t('importBtn');
        document.getElementById('langToggle').innerHTML = t('langBtn');
        document.querySelector('footer').innerText = t('footer');
        document.getElementById('closeModal').innerText = t('closeModal');
        // re-render grid and close modal
        renderGrid(document.getElementById('search').value);
        document.getElementById('modal').classList.add('hidden');
      }

      // ----- tool registry -----
      const tools = [];
      function registerTool(t) { tools.push(t); }

      // ----- grid & modal -----
      function renderGrid(filter='') {
        const grid = document.getElementById('grid');
        if(!grid) return;
        const term = filter.toLowerCase().trim();
        const filtered = tools.filter(tool => {
          const name = t(tool.nameKey);
          const cat = t(tool.catKey);
          return name.toLowerCase().includes(term) || cat.toLowerCase().includes(term);
        });
        grid.innerHTML = filtered.map(tool => `
          <div class="card" data-namekey="${tool.nameKey}">
            <h3>${tool.icon} ${t(tool.nameKey)}</h3>
            <div class="small">${t(tool.catKey)}</div>
            <p style="margin:0.2rem 0; font-size:0.85rem;">${t(tool.descKey)}</p>
          </div>
        `).join('');
        document.querySelectorAll('.card').forEach(card => {
          card.addEventListener('click', () => {
            const tool = tools.find(t => t.nameKey === card.dataset.namekey);
            if(tool) openTool(tool);
          });
        });
      }

      function openTool(tool) {
        const modal = document.getElementById('modal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');
        if(!modal||!title||!body) return;
        modal.classList.remove('hidden');
        title.innerText = t(tool.nameKey);
        body.innerHTML = tool.render();
        if(tool.attach) setTimeout(() => tool.attach(), 20);
      }

      document.getElementById('closeModal')?.addEventListener('click', ()=> document.getElementById('modal').classList.add('hidden'));
      window.addEventListener('click', e => { if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.add('hidden'); });

      // ----- header events -----
      document.getElementById('search')?.addEventListener('input', e => renderGrid(e.target.value));
      document.getElementById('command')?.addEventListener('keydown', e => {
        if(e.key!=='Enter') return;
        const cmd = e.target.value.trim();
        if(cmd.startsWith('search ')) { document.getElementById('search').value = cmd.slice(7); renderGrid(cmd.slice(7)); }
        else if(cmd==='clear') { localStorage.clear(); state = {...defaultState, lang: currentLang}; saveState(); alert('Cleared'); renderGrid(); }
        else if(cmd) alert('⚡ '+cmd);
        e.target.value = '';
      });

      document.getElementById('exportBtn')?.addEventListener('click', ()=>{
        const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download=`omega_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
      });
      document.getElementById('importBtn')?.addEventListener('click', ()=> document.getElementById('importFile')?.click());
      document.getElementById('importFile')?.addEventListener('change', e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            state = Object.assign({}, defaultState, data);
            saveState(); alert('Imported'); setLanguage(state.lang); renderGrid();
          } catch { alert('Invalid file'); }
        };
        reader.readAsText(file); e.target.value='';
      });

      document.getElementById('langToggle')?.addEventListener('click', () => {
        setLanguage(currentLang === 'ar' ? 'en' : 'ar');
      });

      // ----- escape helper -----
      function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); }

      registerTool({ nameKey:'keyEvent', catKey:'keyCat', descKey:'keyDesc', icon:'⌨️',
        render:()=>`<div style="background:#000;padding:1rem;border-radius:16px;text-align:center;" id="keyDisplay">اضغط مفتاحاً</div><pre id="keyInfo"></pre>`,
        attach:()=>{ const handler=e=>{ document.getElementById('keyDisplay').innerText=e.key; document.getElementById('keyInfo').innerText=`مفتاح: ${e.key}  كود: ${e.code}  رمز: ${e.keyCode}`; }; window.addEventListener('keydown',handler); }
      });

      registerTool({ nameKey:'screenInfo', catKey:'screenCat', descKey:'screenDesc', icon:'🖥️',
        render:()=>`<pre id="screenInfo"></pre>`,
        attach:()=>{ document.getElementById('screenInfo').innerText=`العرض: ${screen.width}  الطول: ${screen.height}  المتاح: ${screen.availWidth}x${screen.availHeight}  نسبة البكسل: ${window.devicePixelRatio}`; }
      });

      registerTool({ nameKey:'myIp', catKey:'ipCat', descKey:'ipDesc', icon:'🌐',
        render:()=>`<button class="neon" id="ipBtn">🔍 احصل على IP</button><pre id="ipOut"></pre>`,
        attach:()=>{ document.getElementById('ipBtn')?.addEventListener('click',async()=>{ try{ const r=await fetch('https://api.ipify.org?format=json'); const d=await r.json(); document.getElementById('ipOut').innerText=d.ip; }catch{ document.getElementById('ipOut').innerText='غير متصل / محظور'; } }); }
      });

      registerTool({ nameKey:'userAgent', catKey:'uaCat', descKey:'uaDesc', icon:'🕵️',
        render:()=>`<pre id="uaOut"></pre>`,
        attach:()=>{ document.getElementById('uaOut').innerText=navigator.userAgent; }
      });

      registerTool({ nameKey:'contrast', catKey:'contrastCat', descKey:'contrastDesc', icon:'🎯',
        render:()=>`<div class="row"><input type="color" id="fgColor" value="#ffffff"><input type="color" id="bgColor" value="#000000"><button class="neon" id="checkContrast">🔍</button></div><pre id="contrastOut"></pre>`,
        attach:()=>{ function luminance(hex){ const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255; const a=[r,g,b].map(c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)); return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; } document.getElementById('checkContrast')?.addEventListener('click',()=>{ const fg=document.getElementById('fgColor').value,bg=document.getElementById('bgColor').value; const l1=luminance(fg),l2=luminance(bg); const ratio=(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); document.getElementById('contrastOut').innerText=`النسبة: ${ratio.toFixed(2)} (AA كبير: ${ratio>=3? '✅':'❌'}, AA عادي: ${ratio>=4.5?'✅':'❌'})`; }); }
      });

      registerTool({ nameKey:'imgColor', catKey:'imgColorCat', descKey:'imgColorDesc', icon:'🖼️',
        render:()=>`<input type="file" id="imgUpload" accept="image/*"><canvas id="imgCanvas" style="max-width:100%;"></canvas><div>اللون المختار: <span id="pickedColor" style="display:inline-block;width:30px;height:30px;border-radius:50%;"></span><pre id="colorVal"></pre></div>`,
        attach:()=>{ const canvas=document.getElementById('imgCanvas'), ctx=canvas.getContext('2d'); document.getElementById('imgUpload')?.addEventListener('change',e=>{ const file=e.target.files[0]; if(!file)return; const img=new Image(); img.onload=()=>{ canvas.width=img.width; canvas.height=img.height; ctx.drawImage(img,0,0); }; img.src=URL.createObjectURL(file); }); canvas.addEventListener('click',e=>{ const rect=canvas.getBoundingClientRect(); const x=e.clientX-rect.left,y=e.clientY-rect.top; const pixel=ctx.getImageData(x,y,1,1).data; const hex='#'+((1<<24)+(pixel[0]<<16)+(pixel[1]<<8)+pixel[2]).toString(16).slice(1); document.getElementById('pickedColor').style.backgroundColor=hex; document.getElementById('colorVal').innerText=hex; }); }
      });

      registerTool({ nameKey:'drawingPad', catKey:'drawCat', descKey:'drawDesc', icon:'✏️',
        render:()=>`<canvas id="drawCanvas" width="400" height="300" style="border:1px solid var(--cyan);width:100%;"></canvas><div class="row"><input type="color" id="drawColor" value="#00f5ff"><button class="neon" id="clearCanvas">🧹 مسح</button></div>`,
        attach:()=>{ const c=document.getElementById('drawCanvas'),ctx=c.getContext('2d'); let drawing=false; c.addEventListener('mousedown',()=>drawing=true); c.addEventListener('mouseup',()=>{drawing=false; ctx.beginPath();}); c.addEventListener('mousemove',e=>{ if(!drawing)return; const rect=c.getBoundingClientRect(); const x=e.clientX-rect.left,y=e.clientY-rect.top; ctx.lineWidth=2; ctx.strokeStyle=document.getElementById('drawColor').value; ctx.lineCap='round'; ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y); }); document.getElementById('clearCanvas')?.addEventListener('click',()=>ctx.clearRect(0,0,c.width,c.height)); }
      });

      registerTool({ nameKey:'habitTracker', catKey:'habitCat', descKey:'habitDesc', icon:'✅',
        render:()=>`<input id="habitInp" placeholder="عادة جديدة"><button class="neon" id="addHabit">➕</button><div id="habitList"></div>`,
        attach:()=>{ function renderHabits(){ const list=document.getElementById('habitList'); list.innerHTML=state.habits.map((h,i)=>`<div class="row" style="justify-content:space-between;background:#0f172a;border-radius:16px;padding:0.4rem 1rem;"><span>${escapeHtml(h.name)}</span><button data-i="${i}" class="delHabit">🗑️</button></div>`).join(''); document.querySelectorAll('.delHabit').forEach(b=>b.onclick=()=>{ state.habits.splice(parseInt(b.dataset.i),1); saveState(); renderHabits(); }); } renderHabits(); document.getElementById('addHabit')?.addEventListener('click',()=>{ const v=document.getElementById('habitInp')?.value.trim(); if(v){state.habits.push({name:v}); saveState(); renderHabits();} }); }
      });

      registerTool({ nameKey:'waterTracker', catKey:'waterCat', descKey:'waterDesc', icon:'💧',
        render:()=>`<div class="big" id="waterCount">${state.water||0}</div><button class="neon" id="addWater">➕ كوب</button><button class="neon" id="resetWater">🔄 إعادة</button>`,
        attach:()=>{ document.getElementById('addWater')?.addEventListener('click',()=>{ state.water++; saveState(); document.getElementById('waterCount').innerText=state.water; }); document.getElementById('resetWater')?.addEventListener('click',()=>{ state.water=0; saveState(); document.getElementById('waterCount').innerText=0; }); }
      });

      registerTool({ nameKey:'pomodoroPro', catKey:'pomoCat', descKey:'pomoDesc', icon:'🍅',
        render:()=>`<div class="row"><input id="workMin" type="number" value="${state.pomodoroWork}" placeholder="دقائق العمل"><input id="breakMin" type="number" value="${state.pomodoroBreak}" placeholder="دقائق الراحة"></div><div class="big" id="pomodoroDisp">00:00</div><button class="neon" id="startPomo">▶ ابدأ العمل</button><button class="neon" id="resetPomo">↺</button>`,
        attach:()=>{ let sec=state.pomodoroWork*60, iv=null, isWork=true; const d=document.getElementById('pomodoroDisp'); function upd(){const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');d.innerText=`${m}:${s}`;} upd(); document.getElementById('startPomo')?.addEventListener('click',()=>{ if(iv)return; iv=setInterval(()=>{ sec--; upd(); if(sec<=0){clearInterval(iv);iv=null; isWork=!isWork; sec=(isWork?state.pomodoroWork:state.pomodoroBreak)*60; upd(); alert(isWork?'وقت العمل!':'وقت الراحة!'); }},1000); }); document.getElementById('resetPomo')?.addEventListener('click',()=>{clearInterval(iv);iv=null; sec=state.pomodoroWork*60; upd();}); }
      });

      registerTool({ nameKey:'currency', catKey:'currCat', descKey:'currDesc', icon:'💱',
        render:()=>`<input id="curAmt" type="number" value="1"><select id="curFrom"><option>USD</option><option>EUR</option><option>GBP</option></select><select id="curTo"><option>EUR</option><option>USD</option><option>JPY</option></select><button class="neon" id="curConv">💱</button><pre id="curOut"></pre>`,
        attach:()=>{ document.getElementById('curConv')?.addEventListener('click',async()=>{ const amt=parseFloat(document.getElementById('curAmt')?.value),from=document.getElementById('curFrom')?.value,to=document.getElementById('curTo')?.value; try{ const r=await fetch(`https://open.er-api.com/v6/latest/${from}`); const d=await r.json(); const rate=d.rates[to]; document.getElementById('curOut').innerText=`${amt} ${from} = ${(amt*rate).toFixed(2)} ${to}`; }catch{ document.getElementById('curOut').innerText='خطأ في API'; } }); }
      });

      registerTool({ nameKey:'randomColor', catKey:'randColorCat', descKey:'randColorDesc', icon:'🎨',
        render:()=>`<button class="neon" id="randColorBtn">🎲 عشوائي</button><div id="randColorBox" style="width:100px;height:100px;background:#fff;border-radius:16px;margin:1rem 0;"></div><pre id="randColorHex"></pre>`,
        attach:()=>{ document.getElementById('randColorBtn')?.addEventListener('click',()=>{ const hex='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'); document.getElementById('randColorBox').style.background=hex; document.getElementById('randColorHex').innerText=hex; }); }
      });

      registerTool({ nameKey:'diceRoller', catKey:'diceCat', descKey:'diceDesc', icon:'🎲',
        render:()=>`<select id="diceType"><option value="4">D4</option><option value="6" selected>D6</option><option value="20">D20</option></select><button class="neon" id="rollDice">🎲 رمي</button><div class="big" id="diceResult">?</div>`,
        attach:()=>{ document.getElementById('rollDice')?.addEventListener('click',()=>{ const sides=parseInt(document.getElementById('diceType')?.value)||6; document.getElementById('diceResult').innerText=Math.floor(Math.random()*sides)+1; }); }
      });

      registerTool({ nameKey:'percentage', catKey:'pctCat', descKey:'pctDesc', icon:'📊',
        render:()=>`<input id="pctVal" type="number" placeholder="القيمة"><input id="pctPct" type="number" placeholder="%"><button class="neon" id="pctCalc">🔢</button><pre id="pctOut"></pre>`,
        attach:()=>{ document.getElementById('pctCalc')?.addEventListener('click',()=>{ const v=parseFloat(document.getElementById('pctVal')?.value),p=parseFloat(document.getElementById('pctPct')?.value); document.getElementById('pctOut').innerText=isNaN(v)||isNaN(p)?'غير صالح':`${p}% من ${v} = ${(v*p/100).toFixed(2)}`; }); }
      });

      registerTool({ nameKey:'countdown', catKey:'cdCat', descKey:'cdDesc', icon:'⏳',
        render:()=>`<input id="cdDate" type="datetime-local"><button class="neon" id="cdStart">▶ ابدأ</button><div class="big" id="cdDisp">--:--:--</div>`,
        attach:()=>{ let iv; document.getElementById('cdStart')?.addEventListener('click',()=>{ const target=new Date(document.getElementById('cdDate')?.value).getTime(); if(isNaN(target))return; clearInterval(iv); iv=setInterval(()=>{ const now=Date.now(),diff=target-now; if(diff<=0){clearInterval(iv); document.getElementById('cdDisp').innerText='00:00:00'; return;} const h=String(Math.floor(diff/3600000)).padStart(2,'0'),m=String(Math.floor((diff%3600000)/60000)).padStart(2,'0'),s=String(Math.floor((diff%60000)/1000)).padStart(2,'0'); document.getElementById('cdDisp').innerText=`${h}:${m}:${s}`; },1000); }); }
      });

      registerTool({ nameKey:'textCase', catKey:'caseCat', descKey:'caseDesc', icon:'🔠',
        render:()=>`<textarea id="caseIn" rows="4"></textarea><div class="row"><button class="neon" id="caseUpper">كبير</button><button class="neon" id="caseLower">صغير</button><button class="neon" id="caseTitle">عنوان</button></div><pre id="caseOut"></pre>`,
        attach:()=>{ const ta=document.getElementById('caseIn'); document.getElementById('caseUpper')?.addEventListener('click',()=>document.getElementById('caseOut').innerText=ta.value.toUpperCase()); document.getElementById('caseLower')?.addEventListener('click',()=>document.getElementById('caseOut').innerText=ta.value.toLowerCase()); document.getElementById('caseTitle')?.addEventListener('click',()=>document.getElementById('caseOut').innerText=ta.value.replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.substr(1).toLowerCase())); }
      });

      registerTool({ nameKey:'fileSize', catKey:'fsCat', descKey:'fsDesc', icon:'💾',
        render:()=>`<input id="fsBytes" type="number" placeholder="بايت"><button class="neon" id="fsConv">📦</button><pre id="fsOut"></pre>`,
        attach:()=>{ document.getElementById('fsConv')?.addEventListener('click',()=>{ const b=parseInt(document.getElementById('fsBytes')?.value); if(isNaN(b))return; const kb=b/1024,mb=kb/1024; document.getElementById('fsOut').innerText=`${b} B = ${kb.toFixed(2)} KB = ${mb.toFixed(2)} MB`; }); }
      });

      registerTool({ nameKey:'analogClock', catKey:'analogCat', descKey:'analogDesc', icon:'🕰️',
        render:()=>`<canvas id="analogCanvas" width="200" height="200" style="background:#000;border-radius:50%;"></canvas>`,
        attach:()=>{ const c=document.getElementById('analogCanvas'),ctx=c.getContext('2d'); function draw(){ ctx.clearRect(0,0,200,200); const now=new Date(); const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds(); ctx.save(); ctx.translate(100,100); ctx.strokeStyle='var(--cyan)'; ctx.lineWidth=2; for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,-70);ctx.lineTo(0,-80);ctx.stroke();} ctx.restore(); ctx.save(); ctx.translate(100,100); ctx.rotate((h*30+m*0.5)*Math.PI/180); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,-40);ctx.stroke(); ctx.restore(); ctx.save(); ctx.translate(100,100); ctx.rotate(m*6*Math.PI/180); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(0,-55);ctx.stroke(); ctx.restore(); ctx.save(); ctx.translate(100,100); ctx.rotate(s*6*Math.PI/180); ctx.strokeStyle='var(--pink)'; ctx.lineWidth=1.5; ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(0,-65);ctx.stroke(); ctx.restore(); } setInterval(draw,1000); draw(); }
      });

      // ----- initial render -----
      setLanguage(currentLang);
      renderGrid();
    })();
  </script>
</body>
</html>
