<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omega Neon OS</title>
<style>
:root{--bg:#050816;--p:#0f172a;--t:#dbeafe;--c:#00f5ff;--k:#ff00e5;--g:#39ff14;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 20% 15%,#111936,var(--bg) 45%) fixed,var(--bg);color:var(--t);min-height:100vh;padding:0 .8rem 1rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;backdrop-filter:blur(16px);background:rgba(5,8,22,.85);border-bottom:1px solid rgba(0,245,255,.35);padding:.7rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;border-radius:0 0 26px 26px;margin-bottom:.8rem}
h1{margin-inline-end:auto;color:var(--c);text-shadow:0 0 16px var(--c);font-size:1.6rem;letter-spacing:1px}
input,button,textarea,select{font:inherit;color:#fff;background:#0b1225;border:1px solid rgba(0,245,255,.3);border-radius:14px;padding:.55rem .9rem;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--c);box-shadow:0 0 12px rgba(0,245,255,.5)}
button{cursor:pointer;font-weight:600;border-color:var(--c)}
button:hover{transform:translateY(-1px);border-color:var(--k);box-shadow:0 0 16px rgba(255,0,229,.4)}
input[type=color]{padding:.15rem;height:2.6rem;width:4rem}
textarea{width:100%;resize:vertical}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem}
.chips button{white-space:nowrap;font-size:.85rem;padding:.35rem .8rem;border-radius:99px;opacity:.7}
.chips button.on{opacity:1;background:#12304a;box-shadow:0 0 10px var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.9rem;padding-bottom:1.5rem}
.card{position:relative;background:rgba(15,23,42,.8);border:1px solid rgba(0,245,255,.25);border-radius:var(--r);padding:1rem;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:.35rem}
.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--c);box-shadow:0 0 22px rgba(0,245,255,.5);outline:none}
.card h3{font-size:1.05rem}.card p{font-size:.82rem;opacity:.8}
.small{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);opacity:.8}
.star{position:absolute;top:.4rem;inset-inline-end:.4rem;border:0;background:none;padding:.2rem .4rem;color:var(--k);font-size:1.1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.hidden{display:none!important}
.box{width:100%;max-width:760px;max-height:90vh;overflow-y:auto;background:#0b1120;border:1px solid var(--c);border-radius:26px;padding:1.4rem;box-shadow:0 0 40px rgba(0,245,255,.4)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}.top h2{color:var(--c);font-size:1.2rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}.row input:not([type=checkbox]){flex:1;min-width:6rem}
.f{display:flex;flex-direction:column;gap:.25rem;margin:.55rem 0;font-size:.85rem;opacity:.95}
.f>*:not(span){font-size:.95rem}
.out{white-space:pre-wrap;word-break:break-word;background:#050a18;border:1px solid #2d3a5e;border-radius:14px;padding:.8rem;margin-top:.6rem;min-height:2.6rem;cursor:copy;direction:ltr;text-align:start;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
.out.html{white-space:normal;direction:inherit;font-family:inherit;cursor:auto}.out.html h1,.out.html h2,.out.html h3{margin:.4rem 0;color:var(--c)}.out.html li{margin-inline-start:1.2rem}.out.html code{background:#1e293b;padding:0 .3rem;border-radius:6px}
.big{font-size:2.8rem;font-weight:700;color:var(--c);text-shadow:0 0 16px var(--c);text-align:center;direction:ltr;margin:.4rem 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:#0f172a;border-radius:14px;padding:.45rem .9rem;margin:.4rem 0}
.item label{flex:1;display:flex;gap:.5rem;align-items:center}.done{text-decoration:line-through;opacity:.5}
.dim{opacity:.6;font-size:.85rem}
.bar{height:12px;background:#1e293b;border-radius:9px;overflow:hidden;margin:.6rem 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--k));transition:.3s}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.keys button{padding:.9rem}
.sw{display:inline-block;width:2rem;height:2rem;border-radius:50%;border:1px solid #fff4}
canvas{border-radius:14px;background:#000;max-width:100%}
#toast{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(200%);background:#12304a;border:1px solid var(--c);padding:.6rem 1.2rem;border-radius:99px;z-index:200;transition:.3s}#toast.on{transform:translateX(-50%)}
footer{text-align:center;opacity:.6;color:var(--c);padding:1rem;font-size:.85rem}
</style>
</head>
<body>
<header>
<h1 id="ttl"></h1>
<input id="q" autocomplete="off" style="flex:1;min-width:10rem">
<button id="lg"></button><button id="ex"></button><button id="im"></button>
<input type="file" id="imf" hidden accept=".json">
</header>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="modal hidden" id="modal"><div class="box"><div class="top"><h2 id="mt"></h2><button id="cl">✕</button></div><div id="mb"></div></div></div>
<div id="toast"></div>
<footer id="ft"></footer>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ld=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ld(new Date());
const D={tasks:[],notes:'',habits:[],water:{d:'',n:0},goal:8,pw:25,pb:5,lang:'ar',fav:[]};
let S;
const norm=o=>{S={...D,...o};S.tasks=(S.tasks||[]).map(t=>typeof t==='string'?{t,d:0}:t);S.habits=(S.habits||[]).map(h=>({name:h.name,days:h.days||[]}));if(typeof S.water!=='object')S.water={d:'',n:+S.water||0};if(!Array.isArray(S.fav))S.fav=[]};
try{norm(JSON.parse(localStorage.getItem('omega_state')||'{}'))}catch{norm({})}
const save=()=>{try{localStorage.setItem('omega_state',JSON.stringify(S))}catch{}};
let lang=S.lang==='en'?'en':'ar',cat='all',clean=[];
const tr=a=>Array.isArray(a)?a[lang==='ar'?0:1]:a;
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)};
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch{}};
const every=(f,ms)=>{f();clean.push(setInterval(f,ms))};
const copy=t=>{navigator.clipboard?.writeText(t).then(()=>toast('✓ '+tr(['تم النسخ','Copied'])),()=>{})};
const CAT={prod:['إنتاجية','Productivity'],dev:['مطور','Developer'],sec:['أمان','Security'],util:['أدوات','Utilities'],fin:['مالية','Finance'],health:['صحة','Health'],design:['تصميم','Design'],write:['كتابة','Writing']};
const U={search:['🔍 ابحث… (Ctrl+K)','🔍 Search… (Ctrl+K)'],ex:['💾 تصدير','💾 Export'],im:['📂 استيراد','📂 Import'],lg:['🌐 English','🌐 العربية'],all:['الكل','All'],fav:['★ المفضلة','★ Favorites']};
const T=[],add=(id,i,c,n,d,r)=>T.push({id,i,c,n,d,r});

/* ---------- form factory: live inputs -> output ---------- */
const LT=['النص','Text'],MD=['الوضع','Mode'];
const A=(id,l,v='',r=4)=>({id,l,t:'area',v,r}),I=(id,l,v='',t='text')=>({id,l,v,t}),Sl=(id,l,o)=>({id,l,t:'select',o});
const F=(fields,fn)=>b=>{
 b.innerHTML=fields.map(f=>`<label class=f><span>${tr(f.l)}</span>${f.t==='select'?`<select id=${f.id}>${f.o.map(o=>`<option value="${o[0]}">${tr(o[1])}</option>`).join('')}</select>`:f.t==='area'?`<textarea id=${f.id} rows=${f.r}>${esc(f.v)}</textarea>`:`<input id=${f.id} type=${f.t} step=any value="${esc(f.v)}">`}</label>`).join('')+`<button id=go>🔄</button><div class=out id=out></div>`;
 const o=$('#out',b);
 const run=async()=>{const v={};fields.forEach(f=>v[f.id]=$('#'+f.id,b).value);let r='';
  try{if(!fields.length||fields.some(f=>f.t==='select'||v[f.id]!==''))r=await fn(v)}catch(e){r='⚠ '+(e.message||e)}
  if(r&&typeof r==='object'){o.className='out html';o.innerHTML=r.html}else{o.className='out';o.textContent=r??''}};
 b.addEventListener('input',run);$('#go',b).onclick=run;o.onclick=()=>o.className==='out'&&copy(o.textContent);run()};

/* ---------- productivity ---------- */
add('tasks','📋','prod',['مدير المهام','Task Manager'],['قائمة مهام دائمة','Persistent to-do list'],b=>{
 b.innerHTML=`<div class=row><input id=ti placeholder="${tr(['مهمة جديدة…','New task…'])}"><button id=ta>➕</button></div><div id=tl></div>`;
 const rd=()=>$('#tl',b).innerHTML=S.tasks.map((t,i)=>`<div class=item><label><input type=checkbox data-i=${i} ${t.d?'checked':''}><span class="${t.d?'done':''}">${esc(t.t)}</span></label><button data-x=${i}>🗑️</button></div>`).join('')||`<p class=dim>${tr(['لا توجد مهام','No tasks'])}</p>`;
 const ad=()=>{const v=$('#ti',b).value.trim();if(v){S.tasks.push({t:v,d:0});save();$('#ti',b).value='';rd()}};
 $('#ta',b).onclick=ad;$('#ti',b).onkeydown=e=>e.key==='Enter'&&ad();
 b.onclick=e=>{const x=e.target.dataset;if(x.x!=null)S.tasks.splice(+x.x,1);else if(x.i!=null)S.tasks[+x.i].d^=1;else return;save();rd()};rd()});
add('notes','📝','prod',['ملاحظات نيون','Neon Notes'],['حفظ تلقائي','Autosave scratchpad'],b=>{
 b.innerHTML='<textarea id=n rows=12></textarea><p class=dim id=c></p>';const n=$('#n',b),c=$('#c',b);n.value=S.notes;
 const u=()=>c.textContent=n.value.length+' '+tr(['حرف','chars']);n.oninput=()=>{S.notes=n.value;save();u()};u()});
const P={m:'w',left:S.pw*60,end:0,run:false},C={t:0},W={a:0,s:0,run:false,laps:[]};
const p2=n=>String(n).padStart(2,'0'),fm=s=>p2(Math.floor(s/60))+':'+p2(s%60),wt=()=>W.a+(W.run?performance.now()-W.s:0),fw=ms=>fm(Math.floor(ms/1000))+'.'+p2(Math.floor(ms/10)%100);
setInterval(()=>{
 if(P.run){P.left=Math.max(0,Math.ceil((P.end-Date.now())/1000));if(!P.left){beep();P.m=P.m==='w'?'b':'w';toast(P.m==='w'?tr(['وقت العمل!','Focus time!']):tr(['وقت الراحة!','Break time!']));P.left=(P.m==='w'?S.pw:S.pb)*60;P.end=Date.now()+P.left*1000}}
 if(C.t&&Date.now()>=C.t){C.t=0;beep();toast('⏳ 00:00')}},500);
add('pomo','🍅','prod',['بومودورو','Pomodoro'],['عمل/راحة مستمر في الخلفية','Work/break, keeps running'],b=>{
 b.innerHTML=`<div class=row><input id=w type=number min=1 value=${S.pw}><input id=k type=number min=1 value=${S.pb}></div><div class=big id=d></div><div class=row><button id=s></button><button id=r>↺</button></div>`;
 const u=()=>{$('#d',b).textContent=(P.m==='w'?'🍅 ':'☕ ')+fm(P.left);$('#s',b).textContent=P.run?'⏸':'▶'};
 $('#s',b).onclick=()=>{P.run=!P.run;if(P.run)P.end=Date.now()+P.left*1000;u()};
 $('#r',b).onclick=()=>{P.run=false;P.m='w';P.left=S.pw*60;u()};
 b.oninput=()=>{S.pw=Math.max(1,+$('#w',b).value||25);S.pb=Math.max(1,+$('#k',b).value||5);save();if(!P.run&&P.m==='w')P.left=S.pw*60;u()};every(u,300)});
add('sw','⏲️','prod',['ساعة توقيت','Stopwatch'],['مع اللفات','With laps'],b=>{
 b.innerHTML='<div class=big id=d></div><div class=row><button id=s></button><button id=l>🏁</button><button id=r>↺</button></div><div id=ls></div>';
 const u=()=>{$('#d',b).textContent=fw(wt());$('#s',b).textContent=W.run?'⏸':'▶';$('#ls',b).innerHTML=W.laps.map((x,i)=>`<div class=item><span>#${i+1}</span><span>${fw(x)}</span></div>`).reverse().join('')};
 $('#s',b).onclick=()=>{if(W.run)W.a+=performance.now()-W.s;else W.s=performance.now();W.run=!W.run;u()};
 $('#l',b).onclick=()=>{if(W.run||W.a){W.laps.push(wt());u()}};$('#r',b).onclick=()=>{Object.assign(W,{a:0,run:false,laps:[]});u()};every(u,50)});
add('cd','⏳','prod',['العد التنازلي','Countdown'],['إلى تاريخ ووقت','To a date & time'],b=>{
 b.innerHTML='<div class=row><input id=t type=datetime-local><button id=s>▶</button><button id=x>✕</button></div><div class=big id=d></div>';
 $('#s',b).onclick=()=>{const t=new Date($('#t',b).value).getTime();if(!isNaN(t))C.t=t};$('#x',b).onclick=()=>C.t=0;
 every(()=>{const d=C.t-Date.now(),e=$('#d',b);if(!C.t||d<0){e.textContent='--:--:--';return}const dd=Math.floor(d/864e5);e.textContent=(dd?dd+'d ':'')+p2(Math.floor(d/36e5)%24)+':'+p2(Math.floor(d/6e4)%60)+':'+p2(Math.floor(d/1e3)%60)},500)});
add('habits','✅','prod',['متتبع العادات','Habit Tracker'],['مع سلسلة الأيام 🔥','With streaks 🔥'],b=>{
 b.innerHTML=`<div class=row><input id=hi placeholder="${tr(['عادة جديدة…','New habit…'])}"><button id=ha>➕</button></div><div id=hl></div>`;
 const rd=()=>$('#hl',b).innerHTML=S.habits.map((h,i)=>{const dn=h.days.includes(today());let st=0,d=new Date();if(!dn)d.setDate(d.getDate()-1);while(h.days.includes(ld(d))){st++;d.setDate(d.getDate()-1)}
  return`<div class=item><label><input type=checkbox data-i=${i} ${dn?'checked':''}>${esc(h.name)}</label><span>🔥${st}</span><button data-x=${i}>🗑️</button></div>`}).join('');
 const ad=()=>{const v=$('#hi',b).value.trim();if(v){S.habits.push({name:v,days:[]});save();$('#hi',b).value='';rd()}};
 $('#ha',b).onclick=ad;$('#hi',b).onkeydown=e=>e.key==='Enter'&&ad();
 b.onclick=e=>{const x=e.target.dataset;if(x.x!=null)S.habits.splice(+x.x,1);else if(x.i!=null){const h=S.habits[+x.i],k=today();h.days=h.days.includes(k)?h.days.filter(y=>y!==k):[...h.days,k]}else return;save();rd()};rd()});
add('water','💧','health',['متتبع الماء','Water Tracker'],['يعاد يوميًا','Resets daily'],b=>{
 if(S.water.d!==today())S.water={d:today(),n:0};
 b.innerHTML=`<div class=big id=wc></div><div class=bar><i id=wb></i></div><div class=row><button id=m>➖</button><button id=p>➕ ${tr(['كوب','Cup'])}</button><input id=g type=number min=1 value=${S.goal} style="max-width:5rem"></div>`;
 const u=()=>{$('#wc',b).textContent=S.water.n+' / '+S.goal;$('#wb',b).style.width=Math.min(100,S.water.n/S.goal*100)+'%';save()};
 $('#m',b).onclick=()=>{S.water.n=Math.max(0,S.water.n-1);u()};$('#p',b).onclick=()=>{S.water.n++;u()};$('#g',b).oninput=e=>{S.goal=Math.max(1,+e.target.value||8);u()};u()});

/* ---------- developer ---------- */
add('json','🧩','dev',['أداة JSON','JSON Tool'],['تنسيق / ضغط / تحقق','Format / minify / validate'],F([A('a',LT,'',8),Sl('m',MD,[['f',['تنسيق','Format']],['m',['ضغط','Minify']]])],v=>JSON.stringify(JSON.parse(v.a),null,v.m==='f'?2:0)));
add('b64','📦','dev',['Base64','Base64'],['يدعم العربية','Unicode-safe'],F([A('a',LT),Sl('m',MD,[['e',['تشفير','Encode']],['d',['فك','Decode']]])],v=>v.m==='e'?btoa(unescape(encodeURIComponent(v.a))):decodeURIComponent(escape(atob(v.a.trim())))));
add('url','🔗','dev',['ترميز URL','URL Codec'],['encode / decode','encode / decode'],F([A('a',LT),Sl('m',MD,[['e',['تشفير','Encode']],['d',['فك','Decode']]])],v=>v.m==='e'?encodeURIComponent(v.a):decodeURIComponent(v.a)));
add('hash','🔑','sec',['التجزئة','Hash'],['SHA-1 / 256 / 512','SHA-1 / 256 / 512'],F([A('a',LT),Sl('h',['الخوارزمية','Algorithm'],[['SHA-256','SHA-256'],['SHA-1','SHA-1'],['SHA-512','SHA-512']])],async v=>[...new Uint8Array(await crypto.subtle.digest(v.h,new TextEncoder().encode(v.a)))].map(x=>p2(x.toString(16))).join('')));
add('uuid','🆔','dev',['مولد UUID','UUID Generator'],['v4 آمن','Secure v4'],F([I('n',['العدد','Count'],'5','number')],v=>Array.from({length:Math.min(50,Math.max(1,+v.n||1))},()=>crypto.randomUUID()).join('\n')));
add('regex','🔍','dev',['اختبار Regex','Regex Tester'],['مطابقات ومجموعات','Matches & groups'],F([I('p',['النمط','Pattern']),I('f',['الخيارات','Flags'],'g'),A('t',LT)],v=>[...v.t.matchAll(new RegExp(v.p,v.f.includes('g')?v.f:v.f+'g'))].map((m,i)=>`#${i+1} @${m.index}: ${m[0]}${m.length>1?'  ['+m.slice(1).join(', ')+']':''}`).join('\n')||'—'));
const diff=(a,b)=>{a=a.split('\n');b=b.split('\n');const n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);let i=0,j=0,o=[];while(i<n&&j<m){if(a[i]===b[j]){o.push('  '+a[i]);i++;j++}else if(d[i+1][j]>=d[i][j+1])o.push('- '+a[i++]);else o.push('+ '+b[j++])}while(i<n)o.push('- '+a[i++]);while(j<m)o.push('+ '+b[j++]);return o.join('\n')};
add('diff','📑','dev',['مقارنة النصوص','Text Diff'],['مقارنة أسطر ذكية (LCS)','Smart line diff (LCS)'],F([A('a',['الأصلي','Original']),A('b',['المعدل','Modified'])],v=>diff(v.a,v.b)));
add('base','🔢','dev',['الأنظمة العددية','Base Converter'],['ثنائي، ثماني، عشري، سداسي','Bin, oct, dec, hex'],F([I('n',['الرقم','Number']),Sl('b',['من','From'],[[10,'10 (dec)'],[2,'2 (bin)'],[8,'8 (oct)'],[16,'16 (hex)'],[36,'36']])],v=>{const n=parseInt(v.n,+v.b);if(isNaN(n))throw'Invalid';return`DEC ${n}\nBIN ${n.toString(2)}\nOCT ${n.toString(8)}\nHEX ${n.toString(16).toUpperCase()}`}));
const jd=s=>JSON.stringify(JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))),null,2);

 $('#grid').innerHTML=list().map(t=>`<div class=card data-id=${t.id} tabindex=0><button class=star data-s=${t.id}>${S.fav.includes(t.id)?'★':'☆'}</button><h3>${t.i} ${esc(tr(t.n))}</h3><div class=small>${tr(CAT[t.c])}</div><p>${esc(tr(t.d))}</p></div>`).join('')||'<p class=dim>—</p>';
 $('#chips').innerHTML=[['all',U.all],['fav',U.fav],...Object.entries(CAT)].map(([k,n])=>`<button data-c=${k} class="${k===cat?'on':''}">${tr(n)}</button>`).join('')};
const applyLang=()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#ttl').textContent=lang==='ar'?'⚡ أوميغا نيون أو إس':'⚡ OMEGA NEON OS';$('#q').placeholder=tr(U.search);$('#ex').textContent=tr(U.ex);$('#im').textContent=tr(U.im);$('#lg').textContent=tr(U.lg);$('#ft').textContent=lang==='ar'?`محطة عمل بملف واحد • ${T.length} أداة تعمل دون إنترنت`:`Single-file workstation • ${T.length} offline tools`;render()};
$('#grid').onclick=e=>{const s=e.target.dataset.s;if(s){S.fav=S.fav.includes(s)?S.fav.filter(x=>x!==s):[...S.fav,s];save();render();return}const c=e.target.closest('.card');if(c)open(T.find(t=>t.id===c.dataset.id))};
$('#grid').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))open(T.find(t=>t.id===e.target.dataset.id))};
$('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};
$('#q').oninput=render;$('#q').onkeydown=e=>{if(e.key==='Enter'){const t=list()[0];if(t)open(t)}};
$('#cl').onclick=close;$('#modal').onclick=e=>e.target.id==='modal'&&close();
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();close();$('#q').focus()}});
$('#lg').onclick=()=>{lang=lang==='ar'?'en':'ar';S.lang=lang;save();close();applyLang()};
$('#ex').onclick=()=>{const j=JSON.stringify(S,null,2);copy(j);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='omega_backup_'+today()+'.json';a.click()};
$('#im').onclick=()=>$('#imf').click();
$('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;norm(d);S.lang=lang;save();toast('✓ '+tr(['تم الاستيراد','Imported']));render()}catch{toast('⚠ '+tr(['ملف غير صالح','Invalid file']))}};r.readAsText(f);e.target.value=''};
applyLang();
})();
</script>
</body>
</html>
